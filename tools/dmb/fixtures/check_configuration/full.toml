environment = "kept-only.dme"
[display]
error_level = "warnings"
[diagnostics]
ambiguous_not_bitwise = "errors"
unknown_future_family = "off"
[code_standards]
disallow_relative_proc_definitions = true
disallow_relative_type_definitions = false
[langserver]
dreamchecker = true
[dmdoc]
use_typepath_names = true
index_file = "index.md"
module_directories = ["code/library", "code/engine"]
[debugger]
engine = "auxtools"
[map_renderer]
hide_invisible = ["/obj/hidden"]
[map_renderer.render_passes]
objects = true
[map_renderer.fancy_layers]
"/obj" = 2.5
