[package]
name = "dm-tree"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Immutable resolved DM declarations with separate source occurrences"

[dependencies]
dm-exec = { path = "../dm-exec" }
dm-profile = { path = "../dm-profile" }
dm-ir = { path = "../dm-ir" }
dm-session = { path = "../dm-session" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dm-syntax = { path = "../dm-syntax" }

dm-preprocess = { path = "../dm-preprocess" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dm-wire = { path = "../dm-wire" }
