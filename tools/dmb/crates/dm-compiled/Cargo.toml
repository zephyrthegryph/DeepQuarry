[package]
name = "dm-compiled"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Multi-worktree daemon for the incremental DM compiler"

[dependencies]
byond-dmb = { path = "../.." }
dm-compiler = { path = "../dm-compiler" }
dm-preprocess = { path = "../dm-preprocess" }
dm-syntax = { path = "../dm-syntax" }
dm-resources = { path = "../dm-resources" }
dm-output = { path = "../dm-output" }
dm-host = { path = "../dm-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
