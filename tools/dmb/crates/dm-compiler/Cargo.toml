[package]
name = "dm-compiler"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Incremental query engine for DM projects"

[dependencies]
dm-analysis = { path = "../dm-analysis" }
dm-work = { path = "../dm-work" }
salsa = "=0.28.5"
dm-syntax = { path = "../dm-syntax" }
dm-preprocess = { path = "../dm-preprocess" }
dm-semantics = { path = "../dm-semantics" }
dm-ir = { path = "../dm-ir" }
dm-codegen-byond = { path = "../dm-codegen-byond" }
dm-resources = { path = "../dm-resources" }
dm-output = { path = "../dm-output" }
dm-store = { path = "../dm-store" }
byond-dmb = { path = "../.." }
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmp-serde = "1.3"
im = { version = "15.1", features = ["serde"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[build-dependencies]
sha2 = "0.10"
