[package]
name = "dm-wire"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded schema-framed binary serialization for immutable compiler DTOs"

[dependencies]
serde = "1"
bincode = { version = "2", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
