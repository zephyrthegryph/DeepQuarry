[package]
name = "dm-codegen-byond"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Symbolic native BYOND bytecode and deterministic relocation"

[dependencies]
byond-dmb = { path = "../.." }
dm-syntax = { path = "../dm-syntax" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
dm-store = { path = "../dm-store" }

[dev-dependencies]
serde_json = "1"
