[package]
name = "dm-ir"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Compiler-owned identifiers, HIR, and control-flow MIR for DM"

[lib]
path = "src/lib.rs"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dm-syntax = { path = "../dm-syntax" }
serde_json = "1"
