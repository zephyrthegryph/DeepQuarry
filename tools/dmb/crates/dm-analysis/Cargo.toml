[package]
name = "dm-analysis"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Read-only exports of the shared resolved DM source model"

[dependencies]
dm-preprocess = { path = "../dm-preprocess" }
dm-ir = { path = "../dm-ir" }
dm-tree = { path = "../dm-tree" }
dm-syntax = { path = "../dm-syntax" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Exact reference TOML grammar/error contract; this is not the production DM frontend.
toml_checker = { package = "toml", version = "=0.5.11" }
# Same grammar as current tools/analyze scopes parser; not checker TOML.
toml_analyze = { package = "toml", version = "0.8" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
dm-exec = { path = "../dm-exec" }
dm-codegen-byond = { path = "../dm-codegen-byond" }
