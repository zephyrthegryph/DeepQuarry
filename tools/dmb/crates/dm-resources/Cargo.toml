[package]
name = "dm-resources"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Deterministic resource inputs for the Rust DM compiler"

[dependencies]
dm-exec = { path = "../dm-exec" }
dm-profile = { path = "../dm-profile" }
byond-dmb = { path = "../..", default-features = false }
sha2 = "0.10"
dm-ir = { path = "../dm-ir" }
dm-syntax = { path = "../dm-syntax" }
dm-preprocess = { path = "../dm-preprocess" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
