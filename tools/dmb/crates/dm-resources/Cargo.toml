[package]
name = "dm-resources"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Deterministic resource inputs for the Rust DM compiler"

[dependencies]
byond-dmb = { path = "../.." }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dm-host = { path = "../dm-host" }
dm-store = { path = "../dm-store" }
dm-work = { path = "../dm-work" }
