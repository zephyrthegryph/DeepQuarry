[package]
name = "dm-profile"
version = "0.1.0"
edition = "2021"

[features]
default = []
allocation-counting = []

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-chrome = "0.7"
tracing-flame = "0.2"
inferno = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
