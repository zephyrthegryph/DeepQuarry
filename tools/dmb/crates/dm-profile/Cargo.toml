[package]
name = "dm-profile"
version = "0.1.0"
edition = "2021"

[features]
default = []
allocation-counting = []
# Sampled live-allocation attribution by call site (implies counting); see allocation_sites.rs.
allocation-sites = ["allocation-counting"]

[dependencies]
mimalloc = "0.1.52"
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tracing-chrome = "0.7"
tracing-flame = "0.2"
inferno = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
