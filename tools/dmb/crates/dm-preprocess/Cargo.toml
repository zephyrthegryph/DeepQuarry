[package]
name = "dm-preprocess"
version = "0.1.0"
edition = "2021"

[dependencies]
dm-session = { path = "../dm-session" }
dm-exec = { path = "../dm-exec" }
dm-profile = { path = "../dm-profile" }
dm-syntax = { path = "../dm-syntax" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

im = "15.1"

xxhash-rust = { version = "0.8", features = ["xxh3"] }

dm-wire = { path = "../dm-wire" }

# Exact pinned Original rgb conversion behavior.
color_space = "=0.5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
