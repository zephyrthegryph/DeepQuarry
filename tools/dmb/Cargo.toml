[package]
name = "byond-dmb"
version = "0.1.0"
edition = "2021"
description = "Reader and writer for BYOND compiled world and resource files"
license = "GPL-3.0-only"

[workspace]
members = [".", "crates/*"]
resolver = "2"

# Asset and source hashing are hot even in prototype builds. Keep the compiler
# debuggable without paying the unoptimized SHA-256 cost for large archives.
[profile.dev.package.sha2]
opt-level = 3

# Expansion and persisted cache decoding dominate prototype cold starts.
[profile.dev.package.dm-preprocess]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.lz4_flex]
opt-level = 3

# Full projects parse and lower tens of thousands of procedure bodies.
[profile.dev.package.dm-syntax]
opt-level = 2

[profile.dev.package.dm-codegen-byond]
opt-level = 2

[profile.dev.package.dm-compiler]
opt-level = 2

# Input proof checks and artifact coordination run on every edit and no-op.
[profile.dev.package.dm-compiled]
opt-level = 2

[profile.dev.package.dm-output]
opt-level = 2

# Binary decoding, table linking and serialization also run on every body edit.
[profile.dev.package.byond-dmb]
opt-level = 2

[profile.dev.package.dm-resources]
opt-level = 2

[profile.dev.package.dm-semantics]
opt-level = 2

[profile.dev.package.dm-ir]
opt-level = 2

# Optimizing the large fixture test harness costs gigabytes and minutes in LLVM.
# Production compiler binaries keep the optimized binary-format dependency.
[profile.test.package.byond-dmb]
opt-level = 0

# Keep the large compiler/daemon fixture harnesses cheap to rebuild. Compiler
# binaries retain the optimized development settings above.
[profile.test.package.dm-compiler]
opt-level = 0

[profile.test.package.dm-compiled]
opt-level = 0

[dependencies]
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "byond_dmb"
path = "src/lib.rs"

[[bin]]
name = "dmb-inspect"
path = "src/main.rs"

