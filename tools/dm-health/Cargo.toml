[package]
name = "dm-health"
version = "0.1.0"
edition = "2021"
description = "Source health and conservative type analysis for Dream Maker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny_http = "0.12"
percent-encoding = "2"
sha2 = "0.10"

[[bin]]
name = "dm-health"
path = "src/main.rs"
