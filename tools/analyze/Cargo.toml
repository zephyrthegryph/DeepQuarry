[package]
name = "dq-analyze"
version = "0.1.0"
edition = "2021"
publish = false
description = "DeepQuarry's single lint/analysis engine: one tree load, every tools/ci lint, content-hash cache"
build = "build.rs"

[[bin]]
name = "analyze"
path = "src/main.rs"

[lib]
name = "dq_analyze"
path = "src/lib.rs"

[dependencies]
# Output and environment per request (dmbc daemon hosting): hostio/src/lib.rs.
dq-hostio = { path = "hostio" }
# The query database the analysis results live in (src/incr.rs), shared with the compiler.
dm-query = { path = "../dmb/crates/dm-query" }
# The model, the walk store and every walk allocate millions of small values: a faster allocator is most of a warm run's CPU.
mimalloc = { version = "0.1", default-features = false }
# A fast non-random hasher for the model view's hot maps (the walks look types, members and sites up millions of times).
foldhash = "0.2"
# Parse-aware frontend: SpacemanDMM suite-1.11 dreammaker, vendored (vendor/README.md) to add model persistence.
dreammaker = { path = "vendor/dreammaker" }
# DreamChecker at the same pin (vendor/README.md): `analyze dreamchecker` runs it on this parse.
dreamchecker = { path = "vendor/dreamchecker" }
# The compiler's front end (types only; dmbc builds it): the analysis view `src/model` reads its semantic tree, occurrences and bodies.
dm-tree = { path = "../dmb/crates/dm-tree" }
dm-syntax = { path = "../dmb/crates/dm-syntax" }
dm-ir = { path = "../dmb/crates/dm-ir" }
regex = "1"
fancy-regex = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
toml = "0.8"
walkdir = "2"
md-5 = "0.10"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
# The tests build their models through the compiler's front end (dmbc: parse -> analysis tree), registered by `tests/common`.
dmbc = { path = "../dmb/crates/dmbc" }

# One standalone crate, not a member of the verdigris workspace.
[workspace]

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
opt-level = 1

# Local profile for the build tool's `analyze-build` (tools/build/build.ts picks it unless CI is set or
# DQ_ANALYZE_PROFILE=release). Same optimisation level family as release but no LTO, many codegen units and
# incremental, so editing tools/analyze/src recompiles only the changed units (about 10 s instead of
# about 2 minutes); the lint runs at the same speed within noise. CI and the push gate build `release`.
[profile.dev-fast]
inherits = "release"
opt-level = 2
lto = false
incremental = true
codegen-units = 256

# Dependencies (dreammaker's parser is most of a cold `analyze gen`) are built once, so they get release code generation: few codegen
# units, no incremental. Only this crate stays incremental.
[profile.dev-fast.package."*"]
opt-level = 3
codegen-units = 16
incremental = false

# The vendored parser is a workspace member (a path dependency inside this directory), which `package."*"` does not cover.
[profile.dev-fast.package.dreammaker]
opt-level = 3
codegen-units = 16
incremental = false

[profile.dev-fast.package.interval-tree]
opt-level = 3
codegen-units = 16
incremental = false

# `DQ_ANALYZE_TEST_PROFILE=gate-test`: for analyzer test runs after a source change (9 min with the `test`
# profile, incremental off, 2 jobs). Incremental, many codegen units and line tables only, in the worktree's persistent target
# (tools/dq_cargo_target.sh analyze-test): an edit rebuilds the touched units; dependencies stay optimized and are built once.
[profile.gate-test]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.gate-test.package."*"]
opt-level = 2
