[package]
name = "dq-analyze"
version = "0.1.0"
edition = "2021"
publish = false
description = "DeepQuarry's single lint/analysis engine: one tree load, every tools/ci lint, content-hash cache"
build = "build.rs"

[[bin]]
name = "analyze"
path = "src/main.rs"
required-features = ["legacy-sem"]

[[bin]]
name = "analyze-native"
path = "src/native_main.rs"
required-features = ["native-policy"]

[lib]
name = "dq_analyze"
path = "src/lib.rs"

[features]
default = ["legacy-sem"]
legacy-sem = ["dep:dreammaker"]
native-policy = ["dep:dm-analysis", "dep:dm-tree", "dep:dm-ir", "dep:dm-syntax"]
# Explicit independent migration oracle; never enabled by production defaults.
unified-oracle = ["legacy-sem", "dreammaker/generation-oracle"]

[[example]]
name = "unified_legacy_base_vars"
required-features = ["unified-oracle"]

[[example]]
name = "unified_legacy_records_data_only"
required-features = ["legacy-sem"]

[[example]]
name = "unified_legacy_untyped"
required-features = ["legacy-sem"]

[[example]]
name = "unified_raw_policy"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_decl_policy"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_init_policy"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_base_var_hot_policy"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_base_var_candidates"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_base_vars_policy"
required-features = ["legacy-sem", "native-policy"]

[[example]]
name = "unified_legacy_typed_policies"
required-features = ["unified-oracle"]

[dependencies]
dm-preprocess = { path = "../dmb/crates/dm-preprocess" }
dm-analysis = { path = "../dmb/crates/dm-analysis", optional = true }
dm-tree = { path = "../dmb/crates/dm-tree", optional = true }
dm-ir = { path = "../dmb/crates/dm-ir", optional = true }
dm-syntax = { path = "../dmb/crates/dm-syntax", optional = true }
# The model, the walk store and every walk allocate millions of small values: a faster allocator is most of a warm run's CPU.
mimalloc = { version = "0.1", default-features = false }
# Parse-aware frontend: SpacemanDMM suite-1.11 dreammaker, vendored (vendor/README.md) to add model persistence.
dreammaker = { path = "vendor/dreammaker", optional = true }
regex = "1"
fancy-regex = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
toml = "0.8"
walkdir = "2"
md-5 = "0.10"
sha1 = "0.10"

[build-dependencies]
toml = "0.8"

[dev-dependencies]
# Only explicit native comparison examples/tests create this existing executor.
dm-exec = { path = "../dmb/crates/dm-exec" }
tempfile = "3"

# One standalone crate, not a member of the verdigris workspace.
[workspace]

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
opt-level = 1

# Local profile for the build tool's `analyze-build` (tools/build/build.ts picks it unless CI is set or
# DQ_ANALYZE_PROFILE=release). Same optimisation level family as release but no LTO, many codegen units and
# incremental, so editing tools/analyze/src recompiles only the changed units (about 10 s instead of
# about 2 minutes); the lint runs at the same speed within noise. CI and the push gate build `release`.
[profile.dev-fast]
inherits = "release"
opt-level = 2
lto = false
incremental = true
codegen-units = 256

# Dependencies (dreammaker's parser is most of a cold `analyze gen`) are built once, so they get release code generation: few codegen
# units, no incremental. Only this crate stays incremental.
[profile.dev-fast.package."*"]
opt-level = 3
codegen-units = 16
incremental = false

# The vendored parser is a workspace member (a path dependency inside this directory), which `package."*"` does not cover.
[profile.dev-fast.package.dreammaker]
opt-level = 3
codegen-units = 16
incremental = false

[profile.dev-fast.package.interval-tree]
opt-level = 3
codegen-units = 16
incremental = false

# The merge gates' `analyze_tests` job (tools/dq_merge_gates.sh, DQ_ANALYZE_TEST_PROFILE=gate-test): the job runs exactly when the
# analyzer's sources changed, so the harness cache misses then and the build is on the gate's critical path (9 min with the `test`
# profile, incremental off, 2 jobs). Incremental, many codegen units and line tables only, in the worktree's persistent target
# (tools/dq_cargo_target.sh analyze-test): an edit rebuilds the touched units; dependencies stay optimized and are built once.
[profile.gate-test]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.gate-test.package."*"]
opt-level = 2

