[package]
name = "dq-analyze-client"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "analyze-native"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
