[lint.op_order]
# fixtures and tests pin the relative-priority mechanism itself
exempt_prefixes = ["code/tests/", "code/modules/unit_tests/"]

[lint.silicon_entry]
# tests pin the legacy forms they drive (a probe declaring an INTERACT_SILICON entry)
exempt_prefixes = ["code/modules/unit_tests/", "code/tests/"]

[lint.legacy_forms]
# The engine's own accessors (_own_set / _own_add / _own_put) are called only by the declaration engine and the ownership store.
exempt_prefixes = ["code/engine/", "code/datums/ownership/"]

[lint.legacy_forms.lists]
# Names that are gone except under the listed path prefixes (the folders still calling them): `name @ prefix;prefix = hint`.
banned_outside = [
  "om_link @ code/datums/om/;code/modules/unit_tests/;code/tests/ = declare the pair with links() in CAPABILITIES and write it with rel_set() (a base-type end: sparse = TRUE and link_make()); only the OM core and its tests still call it",
  "om_unlink @ code/datums/om/;code/modules/unit_tests/;code/tests/;code/modules/food/kitchen/gibber.dm  = rel_set(holder, nameof(var), null) on the declared link, or link_break() on a sparse one (the gibber's ledger slot is KR5)",
]
# Names of forms that no longer exist (a hard ban, no baseline): `name = hint`.
banned = [
  "DECLARE_VERB = verb_entry(path) in the type CAPABILITIES block",
  "DECLARE_LOGIN_VERB = verb_entry(path, login = TRUE) in the type CAPABILITIES block",
  "DECLARE_VERB_IF = verb_entry(path, when = nameof(field)); write the tracked field through its setter",
  "DECLARE_VERB_HIDE = verb_entry(path, hidden = TRUE) in the type CAPABILITIES block",
  "EVENT_HANDLER = a synchronous typed action handler registered with observe() or intercept()",
  "om_hook = observe(source, /datum/notice/x, listener, then(PROC_REF(h))) (doc/rewrite/codemod_rules.md)",
  "om_unhook = unobserve(source, /datum/notice/x, listener)",
  "om_unhook_all = unobserve each source, or let the listener's death end the hooks",
  "om_hooked = ask the activation: nothing replaces it",
  "hooks_in = the OM hook table is gone: observe() grants a hook capability",
  "hooks_out = the OM hook table is gone: observe() grants a hook capability",
  "own_set = rel_set(holder, nameof(v), value): the engine's accessor is _own_set, never called from content",
  "own_add = rel_add(holder, nameof(v), value): the engine's accessor is _own_add, never called from content",
  "_own_set = rel_set(holder, nameof(v), value): the accessor is private to code/engine and code/datums/ownership",
  "_own_add = rel_add(holder, nameof(v), value): the accessor is private to code/engine and code/datums/ownership",
  "_own_put = rel_add(holder, nameof(v), value, key): the accessor is private to code/engine and code/datums/ownership",
  "own_put = rel_add(holder, nameof(v), value, key): the engine's accessor is _own_put, never called from content",
  "ability_pay = a malf ability's price is costs = list(\"[RES_CPU]\" = price) on its request, or res_spend(user, RES_CPU, price) when it asks nothing",
  "explosion_contents_severity = declare blast_contents() (code/library/structures/blast_contents.dm); the explosion service reads explosion_contents_severity_of()",
  "DECLARE_UI = interface(\"Window\") in the type's CAPABILITIES block (doc/rewrite/final_api.html section 13)",
  "DECLARE_UI_STATE = interface(..., state = nameof(GLOB.x_state)), or a tgui_state() override for a state per instance",
  "UI_ACT = op(\"action\", ui_act(\"action\", arg(...)), needs(...), then(PROC_REF(handler))) with handler(datum/act/op/A, args...)",
  "UI_ACT_PROC = an op's handler proc(datum/act/op/A, args...)",
  "UI_ACT_OVERRIDE = override the op's handler proc on the subtype",
  "UI_ACT_FORWARD = interface(..., forwards = nameof(var))",
  "UI_ACT_FALLBACK = op(key, ui_act(\"*\"), then(...)): answers every action no op names; A.window_action() says which",
  "UI_ACT_NESTED = an op whose handler routes the nested message itself (payload_args() runs its data through schemas)",
  "UI_SUBACT = a plain proc, routed by the op's handler through payload_args()",
  "UI_SUBACT_PROC = a plain proc, routed by the op's handler through payload_args()",
  "UI_SUBACT_OVERRIDE = override the plain sub-action proc",
  "UI_ACT_PREF_PROC = a preference editor routes its actions in its handle_action() override",
  "UI_DATA = ui_data(datum/act/eval/A) returning the window's data",
  "UI_DATA_REPLACE = ui_data(datum/act/eval/A) returning the window's data",
  "ui_dispatch = a window button is an op with a ui_act() binding (op_ui_act())",
  "ui_subdispatch = the op's handler routes its sub-actions (payload_args())",
  "ui_dispatch_typed = asks() on the op; the handler reads A.step_value()",
  "ui_decl_of = present_interface(holder) for the window's declaration",
  "ui_declared_data = ui_data(datum/act/eval/A)",
  "ui_act_allowed = a requirement on the op (needs(req(PROC_REF(x)))), or an inline gate in the handler",
  "ui_nested_allowed = a check in the op's handler",
  "ui_nested_done = the op's handler runs it after the sub-action",
  "act_ask = asks(/datum/prompt/kind, fields = list(...), step = \"k\") on the op; the handler reads A.step_value(\"k\")",
  "om_act_ask = asks() on the op; the handler reads A.step_value()",
  "ui_modal_opened = an op bound to \"modal:<id>\" that asks() its question",
  "ui_modal_answered = an op bound to \"modal:<id>\"; its handler reads A.step_value()",
  "DECLARE_REAGENTS = reagents(volume, starts = list(...)) in the type's CAPABILITIES block; a subtype adds with configure(reagents(add = list(...))) (code/library/reagents/reagents.dm, doc/rewrite/reagents.md)",
  "DECLARE_REAGENTS_TINTED = reagents(..., tint = TRUE), or configure(reagents(add = ..., tint = TRUE)) on a subtype",
  "DECLARE_REAGENTS_TYPED = reagents(..., holder = /datum/reagents/x)",
  "DECLARE_REAGENT_FROM_VAR = reagents(nameof(volume_var), starts_from = list(nameof(id_var) = nameof(amount_var)))",
  "DECLARE_NO_REAGENTS = without(CAP_REAGENTS) in the type's CAPABILITIES block",
  "set_reagent_var = reagents(..., starts_from = ...) in CAPABILITIES",
  "create_reagents_on = reagents() in CAPABILITIES makes the holder (its preinit hook)",
]

