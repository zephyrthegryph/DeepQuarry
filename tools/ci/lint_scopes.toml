# Where each engine lint's path exemptions and named lists live (tools/analyze, doc: tools/analyze/README.md).
# A lint's section is found by its name (`[lint.scheduler]`), else by its group (`[lint.sys]` serves every sys/*).
#   exempt_prefixes = rel path starts with     exempt_contains = rel path contains     exempt_files = exact path
#   [lint.<name>.lists] = named lists a rule reads (declared in the lint's Meta::lists, validated at startup)

[allow]
# ALLOW names read by lints that are not (yet) engine lints; the engine's own lints declare theirs.
known = ["api", "cache", "check_grep", "containment", "cooldown", "doc_snippets", "decl", "derived_reads", "init", "instance_list", "interactions", "latent", "lifecycle", "om_internal", "ownership", "organ_slots", "pollers", "radial", "registry", "scheduler", "silent_catch", "spatial", "tracked", "system_boundary", "verb_category", "subsystem_fire", "ui_actions"]

[lint.sys]
# sys_lint.py EXEMPT: tests and benchmarks build the forbidden things on purpose; code/engine/_generated/ is written by `analyze gen`.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/", "code/engine/_generated/"]

# A sys module with an own section of path exemptions replaces [lint.sys] for that module (the section is found
# by lint name first), so it repeats the sys_lint.py EXEMPT prefixes above and adds the module's own.
[lint."sys/sync_sql"]
# sync_sql.py EXEMPT_FILES: the database layer itself (boot and shutdown queries, the flow wrapper, the local
# SQLite database, world/IsBanned) may block.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/"]
exempt_files = [
  "code/controllers/subsystems/dbcore.dm",
  "code/controllers/subsystems/sqlite.dm",
  "code/datums/om/flow_io.dm",
  "code/modules/admin/IsBanned.dm",
]

[lint."sys/usr_use"]
# usr_use.py SKIP_PREFIXES: a `#define` in the macro library is read in the caller's context. code/engine/ is the engine's one reader and
# writer of usr: the generated native input overrides and with_actor() (code/engine/lifeforms/input.dm).
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/", "code/__defines/", "code/engine/"]

[lint.ui_actions]
# ui_actions_lint.py EXEMPT: tests and benchmarks build act_ procs without a TSX client on purpose.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/"]
[lint.cap_bits.lists]
# cap_bits_lint.py: REGISTRY, WRITERS and the unit-test prefix. These files are still scanned for bit
# definitions; the lists only decide where a cap_state write is legal.
registry = ["code/__defines/cap_bits.dm"]
writers = ["code/datums/capabilities/capabilities.dm", "code/engine/declare/capability_tables.dm"]
write_exempt_prefixes = ["code/modules/unit_tests/"]

[lint.pool.lists]
# pool_lint.py EXEMPT_PREFIX: `new` and unreleased take() are not counted here (the files still
# declare pooled types and release).
exempt_prefixes = ["code/modules/unit_tests/", "code/engine/state/pool.dm"]

[lint.om_internal]
