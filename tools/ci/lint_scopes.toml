# stored_refs (tools/analyze/src/lints/stored_refs.rs; doc/rewrite/proposals/reference_storage.md): every stored atom/datum reference
# is a declared relation or a weak ref. The reference machinery itself (relation tables, handles, timers' capture, the lifecycle
# transaction, the garbage collector) stores raw references by design and is exempt by path, with tests, benchmarks and TGS.
# exempt_types: types an instance never qdel()s, so a reference to one cannot pin a deleted object: the kernel's systems and
# controllers (world singletons), and registries/flyweights (the ownership index adds REGISTRY_TYPE()s itself).
[lint.stored_refs]
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/", "code/modules/tgs/", "code/tests/", "code/engine/refs/", "code/engine/time/", "code/datums/ownership/", "code/datums/om/", "code/datums/lifecycle/", "code/controllers/subsystems/garbage.dm", "code/modules/admin/view_variables/reference_tracking.dm", "code/engine/_generated/", "code/engine/change/", "code/engine/lifeforms/", "code/engine/stats/", "code/controllers/kernel/", "code/controllers/measure/"] # (and the kernel loop and its meter) # change delivery, lifeform and stat machinery: engine tables (relations proposal section 4)
exempt_files = ["code/__defines/tgs.dm", "code/datums/registries.dm", "code/controllers/kernel/membership.dm", "code/datums/native/entities.dm", "code/engine/declare/link_state.dm", "code/engine/actions/change.dm", "code/engine/actions/every.dm", "code/engine/actions/notices.dm", "code/engine/actions/reactions.dm", "code/engine/kernel/jobs.dm", "code/engine/io/jobs.dm", "code/engine/state/pool.dm", "code/engine/state/serializer.dm", "code/engine/present/type_verbs.dm", "code/engine/declare/capability_tables.dm", "code/engine/present/native_ends.dm", "code/engine/kernel/requests.dm", "code/engine/kernel/inbox.dm", "code/engine/kernel/sequence.dm", "code/engine/parts/run.dm", "code/engine/parts/resource.dm", "code/engine/declare/activation.dm", "code/engine/actions/hooks.dm", "code/engine/hooks/native_watch.dm"] # (run-state records the kernel sweeps: requests, input events, pending ops, reservations, activations, hooks, native watches; relations proposal section 7) the registry/membership/relation storage, and the kernel's own queues and tables (relations proposal section 4: engine tables are exempt by path and covered by dq_gc_sweep and the hard-delete counter)
[lint.stored_refs.lists]
# /datum/gear_tweak: a loadout tweak is a stateless flyweight (a colour, a name prompt): a reference to one names behaviour, not a world entity.
exempt_types = ["/datum/system", "/datum/shared_cache", "/datum/controller", "/datum/world_service", "/datum/capability", "/datum/reaction", "/datum/xform_group", "/datum/entry", "/datum/xform", "/transformation", "/datum/own_entry", "/datum/derived_entry", "/datum/op_def", "/datum/gear_tweak", "/datum/gas_mixture", "/datum/debugger", "/datum/tracy", "/datum/admins", "/datum/persistent_client", "/datum/player_tips", "/datum/announcement", "/mob/dview", "/mob/proccall_handler", "/datum/look", "/datum/dispatch_context", "/datum/materialize_batch"]
# Reviewed non-entity and singleton types (a reference to one cannot pin a deleted world entity; none is ever qdel()led, grep qdel across code/):
# /datum/gas_mixture: an opaque handle to the native arena (meter::watched_air, the air system's mix caches).
# /datum/debugger, /datum/tracy: tooling singletons behind the Debugger and Tracy globals. /datum/admins, /datum/persistent_client: per-player records held for the process
# lifetime (client::holder, client::persistent_client, admin_datums). /datum/player_tips: the stateless tip picker. /datum/announcement: message flyweights
# (priority_announcement, command_announcement). /mob/dview, /mob/proccall_handler: the single dview and admin proc-call helper mobs behind their globals.
# /datum/look (the shared look_builder), /datum/dispatch_context (dispatch_context_now), /datum/materialize_batch (active_batch): per-call records held by one global or system var for the call.
# Holder types whose instances live for one call or one resolution and are dropped with it (relations proposal D8, reviewed per type):
# one emitted event (code/engine/declare/definition_types.dm), a draw's look builder (one draw), one SQL request and its answer rows (code/engine/io/db.dm),
# a relation edge (engine relation storage, ended with its relation; covered by dq_gc_sweep), a materialize frame (open only while one load initializes, code/controllers/subsystems/atoms_batch.dm), a reservation (lives until its op ends; the subtypes outside code/engine/parts/resource.dm too), one dispatch's context (code/datums/capabilities/dispatch.dm), op candidates, the resolution record, op sources and provider rows (code/engine/parts/resolve.dm, provider.dm), examine rows
# (code/engine/present/examine.dm), constructor arguments (code/engine/lifeforms/params.dm), one serializer run's context (code/engine/state/serializer.dm).
# A system's hot work queues ("type::var"), reviewed per var (relations proposal wave 2): each entry is drained within a tick or two and
# the drain skips a deleted member (QDELETED), so a queue never pins a deleted object past its next drain. A declared relation here would
# add a reverse-index write to every enqueue (thousands per tick for lighting).
# Reviewed lists in the same list (each read and confirmed; none holds a world entity that something else deletes mid-round):
# after_init_pending / after_init_loose: instances awaiting after_init(); the first drops each when its Initialize() returns, the flush skips QDELETED. sectors_to_initialize: one-shot boot queue, nulled once drained.
# Registries of never-deleted records or data: system-owned records removed explicitly (contracts identities/rules/windows, proximity cells/eyes), gas-mixture and asset-cache items, tgui asset generations (kept for the process lifetime),
# wiki spoiler entries (type paths), virusDB / archive_diseases (disease records and copies), department_accounts, mob_chunks, belly overlay asset items, construction frame flyweights, signal and reagent `data` payload lists, asset/simple::assets.
# Hot reverse indexes where a declared relation would add a write per change: /datum::open_tguis (every ui open and close) and /datum/lighting_corner::affecting (every light update); both are cleared by their owner's own teardown.
work_queues = ["/datum/system/lighting::sources_queue", "/datum/system/radiation::dirty_turfs", "/datum/system/atoms::after_init_pending", "/datum/system/atoms::after_init_loose", "/datum/system/shuttles::sectors_to_initialize", "/datum/system/air::planetary", "/datum/system/assets::cache", "/datum/system/tgui::asset_generations", "/datum/system/internal_wiki::spoiler_entries", "/datum/system/contracts::subject_identities", "/datum/system/contracts::opportunity_rules", "/datum/system/contracts::opportunity_windows", "/datum/system/proximity::cells", "/datum/system/proximity::eyes", "/datum/controller/global_vars::virusDB", "/datum/controller/global_vars::department_accounts", "/datum/controller/global_vars::archive_diseases", "/datum/controller/global_vars::mob_chunks", "/datum/controller/global_vars::dq_belly_overlay_aci_by_name", "/datum/controller/global_vars::construction_frame_wall", "/datum/controller/global_vars::construction_frame_floor", "/datum/signal::data", "/datum/reagent::data", "/datum/asset/simple::assets", "/datum::open_tguis", "/datum/lighting_corner::affecting"] # each pinned by relations_work_queue_* (enqueue, delete, drain)
transient_types = ["/datum/definition_event", "/datum/look", "/datum/io/sql", "/datum/relation_edge", "/datum/materialize_batch", "/datum/reservation", "/datum/dispatch_context", "/datum/op_cand", "/datum/op_resolution", "/datum/op_src", "/datum/prov", "/datum/present_row", "/datum/make_args", "/datum/state_context", "/datum/centry"] # /datum/centry: compiled once from the declarations and never deleted; its item is an entry or capability definition (both exempt types), so the var cannot pin a deleted object

