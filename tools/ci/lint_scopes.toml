# Where each engine lint's path exemptions and named lists live (tools/analyze, doc: tools/analyze/README.md).
# A lint's section is found by its name (`[lint.scheduler]`), else by its group (`[lint.sys]` serves every sys/*).
#   exempt_prefixes = rel path starts with     exempt_contains = rel path contains     exempt_files = exact path
#   [lint.<name>.lists] = named lists a rule reads (declared in the lint's Meta::lists, validated at startup)

[allow]
# ALLOW names read by lints that are not (yet) engine lints; the engine's own lints declare theirs.
known = []

[lint.sys]
# sys_lint.py EXEMPT: tests and benchmarks build the forbidden things on purpose.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/"]

[lint.ui_actions]
# ui_actions_lint.py EXEMPT: tests and benchmarks build act_ procs without a TSX client on purpose.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/"]
[lint.cap_bits.lists]
# cap_bits_lint.py: REGISTRY, WRITERS and the unit-test prefix. These files are still scanned for bit
# definitions; the lists only decide where a cap_state write is legal.
registry = ["code/__defines/cap_bits.dm"]
writers = ["code/datums/capabilities/capabilities.dm"]
write_exempt_prefixes = ["code/modules/unit_tests/"]

[lint.pool.lists]
# pool_lint.py EXEMPT_PREFIX: `new` and unreleased take() are not counted here (the files still
# declare pooled types and release).
exempt_prefixes = ["code/modules/unit_tests/", "code/datums/lifecycle/pool.dm"]

[lint.om_internal]
# om_internal_lint.py SKIP: the scheduler core and the macros that map the public API onto it.
exempt_prefixes = ["code/datums/om/", "code/__defines/om.dm"]

[lint.stance_examine.lists]
# stance_examine_lint.py INPUT_STANCE_READERS: the input layer, the only readers of a mob's stance
# (prefixes).
input_stance_readers = [
    "code/modules/mob/combat_mode.dm",
    "code/datums/interactions/",
    "code/datums/operations/actions.dm",
    "code/datums/operations/req.dm",
    "code/modules/keybindings/",
    "code/modules/mob/living/living_movement.dm",
    "code/modules/vore/eating/belly_obj_resist.dm",
    "code/modules/combat_ai/",
    "code/modules/unit_tests/",
]

[lint.leftovers.lists]
# leftovers_lints.py EXEMPT["radial"]: `^code/_onclick/hud/radial[^/]*\.dm$`, as a prefix; the rest of the
# path must hold no `/` and end in `.dm`. Applies to the radial kind only.
radial_impl_prefixes = ["code/_onclick/hud/radial"]

[lint.cooldown]
# cooldown_lint.py SKIP_DIRS. The EXPIRY_DECLARE name index still reads these files.
exempt_prefixes = ["code/modules/unit_tests/", "code/controllers/", "code/datums/om/"]
[lint.system_boundary]
# system_boundary_lint.py SKIP_DIRS: unit tests read private state through system_debug().
exempt_prefixes = ["code/modules/unit_tests/"]

[lint.latent]
# latent_lint.py SKIP_DIRS: os.walk prunes any directory named unit_tests.
exempt_contains = ["/unit_tests/"]

[lint.registry]
# registry_lint.py: the boilerplate macro's own definition.
exempt_prefixes = ["code/__defines/"]

[lint.deadline_polling]
# check_deadline_polling.py: unit tests poll on purpose.
exempt_contains = ["/unit_tests/"]

[lint.verb_category]
# verb_category_lint.py: unit tests build raw categories on purpose.
exempt_prefixes = ["code/modules/unit_tests/"]

[lint.i7_handler]
# i7_handler_lint.py: test fixtures record calls to the dispatchers themselves.
exempt_prefixes = ["code/modules/unit_tests/"]
[lint.i7_handler.lists]
# The dispatchers, and the client's activate-held-item verb (which calls attack_self).
allowed = [
  "/atom/proc/attackby",
  "/atom/proc/attack_hand",
  "/atom/proc/click_alt",
  "/atom/proc/MouseDrop_T",
  "/obj/item/proc/attack_self",
  "/client/verb/attack_self",
]

[lint.subsystem_fire.lists]
# subsystem_fire_lint.py CORE: the kernel and the engines that own their own frame (completion_plan.md sec 3.6).
core = [
  "behaviours",    # the OM scheduler
  "dbcore",        # async query pump
  "garbage",
  "input",         # player input must never wait on a lane budget
  "profiler",      # MC profiling: reads subsystem diagnostics, config-driven interval
  "tgui",
  "verb_manager",  # and its speech_controller subtype
]
