  "DECLARE_REAGENTS = reagents(volume, starts = list(...)) in the type's CAPABILITIES block; a subtype adds with configure(reagents(add = list(...))) (code/library/reagents/reagents.dm, doc/rewrite/reagents.md)",
  "DECLARE_REAGENTS_TINTED = reagents(..., tint = TRUE), or configure(reagents(add = ..., tint = TRUE)) on a subtype",
  "DECLARE_REAGENTS_TYPED = reagents(..., holder = /datum/reagents/x)",
  "DECLARE_REAGENT_FROM_VAR = reagents(nameof(volume_var), starts_from = list(nameof(id_var) = nameof(amount_var)))",
  "DECLARE_NO_REAGENTS = without(CAP_REAGENTS) in the type's CAPABILITIES block",
  "set_reagent_var = reagents(..., starts_from = ...) in CAPABILITIES",
  "create_reagents_on = reagents() in CAPABILITIES makes the holder (its preinit hook)",
]

