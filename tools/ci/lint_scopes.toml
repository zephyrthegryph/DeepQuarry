# allow_annotations.exempt_path(): EXEMPT_DIRS + EXEMPT_FILES. Unit tests and benchmarks build the forbidden
# things on purpose, and the vendored tgstation-server DMAPI is kept verbatim. The old lints that import
# exempt_path() read one constant; each engine lint keeps its own copy of the two lists here.
[lint.ownership]
# ownership_lint.py: the index, the usage map, unknown_var, kinds, matrix and contradiction still read these
# files; string_name, removed, callback, handle and raw_write skip them.
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/", "code/modules/tgs/"]
exempt_files = ["code/__defines/tgs.dm"]

# E5 semantic lints (tools/analyze/src/lints/sem_*.rs; tools/analyze/README.md, "Semantic layer").
# try_calls: extra calls that survive macro expansion as a world-action start (ACT_TRY pairing), besides ACT_TRY, act_try, e0_act_try and the
# act_<name> of every non-FIXED ACTION() (which ACT_TRY expands to, added by the lint itself).
# The E0 proofs and the legacy op tests name op keys declared in comment form (the final syntax) or by DECLARE_INTERACTIONS;
# E1 turns the comment declarations into real markers, then these exemptions go.
# E1's tests name unknown keys and text sources on purpose (the build errors they prove), its fixtures stand in for op() with entry_of("op", ...),
# and code/engine/_generated/ holds copies of declarations the lints already read at their source.
[lint."sem/keys"]
exempt_files = ["code/modules/unit_tests/dq_e0_proofs_tests.dm", "code/modules/unit_tests/dx_op_resolution_tests.dm", "code/modules/unit_tests/dq_e1_declare_tests.dm", "code/tests/engine/e1_fixtures.dm"]
exempt_prefixes = ["code/engine/_generated/"]

[lint."sem/handlers".lists]
try_calls = []

