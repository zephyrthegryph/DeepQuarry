exempt_files = ["code/__defines/tgs.dm"]

[lint.auto_tracked.lists]
# Vars the read-driven inference (tools/analyze/src/gens/auto_tracked.rs) never gives a generated setter: `var` for any type, `/type::var` for
# one. Engine lifecycle state whose writes are on the qdel and bridge hot paths and which reactive code reads only through QDELETED() and
# its siblings; the destroy itself publishes through on_destroy().
exclude = ["gc_destroyed", "vg_entity", "datum_flags"]
# (datum_flags: lifecycle bits the engine sets inside a refresh (cadence_start) and during destroy; a setter would mark the holder from its own refresh.)
# Vars the inference tracks although no reactive code reads them in a way it can see, or no `set_v()` call is typed to their type: their callers reach the
# machine through an accessor the call scan cannot type (`connected().set_locked(...)`, `machine().set_active(...)`) while another type owns a
# hand-written `set_v`; or a base-type var a `when(nameof(v))` gate reads that only subtypes' defaults ever set (base_vars wants it housed).
# `/type::var`, one per var; delete an entry once its callers hold a typed local.
include = ["/obj/machinery/ion_engine::on", "/obj/machinery/shieldwall::active", "/obj/machinery/vending::active", "/obj/machinery/mineral/processing_unit::active", "/obj/machinery/bodyscanner::locked", "/obj/machinery/dna_scannernew::locked", "/obj/item/disk/species::species", "/atom/movable::drag_buckle", "/mob::speak_emote", "/mob::shouldnt_see"]
# A lazily refreshed accumulator: check_charge() (reached from conditions and draws) tops it up from the clock, so the write happens inside an output
# (PURITY). It is a memo of time, not state anything publishes.
exclude_memo = ["/obj/item/cell::material_discharge_credit", "/atom::flags"]
# (atom flags: lifecycle bits (ATOM_INITIALIZED, ATOM_MATERIALIZED) set while an atom is materialized, which can happen inside a draw.)
# Test fixtures that count their own draws from inside draw(): an output must not write tracked state (PURITY), and the counter is the test's probe.
exclude_fixtures = ["/obj/gdeps_probe::raw_ok", "/obj/dq_small_look_composer::draws", "/obj/machinery/dq_idle_redraw_probe::draws", "/obj/item/remote_scene_tool/voodoo_doll/dq_small_counting::draws", "/obj/cap_fixture/dx_deps_derive::draw_calls", "/obj/cap_fixture/dx_deps_laser::draw_calls", "/obj/cap_fixture/dx_deps_legacy::draw_calls", "/obj/cap_fixture/dx_deps_watcher::draw_calls"]

