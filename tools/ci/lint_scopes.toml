# Homes for base-type vars (doc/rewrite/proposals/base_vars.md). A var a home macro names on its own type
# (`TRACKED(/mob, stat)`), or whose declared type is under a home type path (the HUD datum, the profile records,
# the sparse and cooldown stores), is not a `base_var` site. A lane that lands a new home adds it here.
base_var_home_macros = ["TRACKED", "TRACKED_SCHEMA", "TRACKED_DATA", "SETTER", "STAT"]
base_var_home_types = ["/datum/hud", "/datum/record", "/datum/sparse_slots", "/datum/cooldown_table"]
# The most hot-var rows `[lint.base_vars.tables.base_var_home_hot]` may hold (one number). It only falls.
hot_ceiling = ["14"]
# records_data_only: the procs a /datum/record may define (accessors).
record_accessor_prefixes = ["set_", "get_"]

[lint.base_vars.tables.base_var_home_hot]
# Hot per-tick base vars that stay on their base type, one `"<type>/<var>" = "<justification>"` row each. A listed var is homed
# (not a `base_var` site). Criteria: declared on a base type, read on a per-tick, per-move or per-turf-update path by most
# instances, not per-type constant data (that is a trait block), not rare (that is a sparse slot). The justification is at
# least 40 characters and names the hot reader (a .dm file and the proc); a row whose var no longer exists fails (`hot_home`).
"/atom/flags_1" = "read per turf activation: SSair.add_to_active tests flags_1 & INITIALIZED_1 (code/ATMOSPHERICS/SSair.dm:343); set on every atom at init"
"/atom/can_atmos_pass" = "read per turf update for each object on the turf: air_block_mask folds it (code/ATMOSPHERICS/environmental/LINDA_system.dm:58)"
"/atom/movable/pressure_resistance" = "read per spacewind move: experience_pressure_difference move_prob (code/ATMOSPHERICS/environmental/LINDA_turf_tile.dm:338)"
"/atom/flags" = "read on every move and bump scan: ON_BORDER tests in /turf/Enter and contains_dense_objects (code/game/turfs/turf.dm:349), held by all atoms"
"/atom/pass_flags" = "read on every CanPass test of every move and projectile pass: pass_flags & passflag (code/game/atom/_atom.dm:439), held by all atoms"
"/atom/movable/movement_type" = "read per entering mover: CHECK_BITFIELD(mover.movement_type, UNSTOPPABLE) in /turf/Enter (code/game/turfs/turf.dm:335)"
"/atom/movable/moving_diagonally" = "read and written on every diagonal step: the state machine in Move() (code/game/atoms_movable.dm:232-250), held by all movables"
"/atom/movable/l_move_time" = "read on every Move(): move_speed = world.time - l_move_time (code/game/atoms_movable.dm:294), held by all movables"
"/atom/movable/throwing" = "read on every footstep and bump: footstep.dm throw check (code/datums/behaviours/footstep.dm:70), Bump finalize (code/game/atoms_movable.dm:376)"
"/atom/light_sources" = "read on every Moved(): the loop that updates each light source on the mover (code/game/atoms_movable.dm:322), walked for all movers"
"/mob/m_intent" = "read on every step: walk-versus-run delay in living_movement.dm (code/modules/mob/living/living_movement.dm:20) and mob_movement.dm:21"
"/mob/living/now_pushing" = "read on every bump into a movable: the push guard in living_movement.dm (code/modules/mob/living/living_movement.dm:51) and carbon.dm:382"
"/mob/track_blood" = "read on every human footstep: blood tracking in /turf/simulated/Entered (code/content/turfs/simulated.dm:108-116), held by all mobs"

