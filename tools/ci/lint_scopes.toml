[lint.system_boundary]
# system_boundary_lint.py SKIP_DIRS (unit tests read private state through system_debug()) and
# GENERATED_DIRS (the generated verdigris bindings are emitted for every system, so a new binding must
# not raise a ceiling). code/engine/_generated/ is where `analyze gen system_accessors` writes each SYSTEM_ACCESSOR proc:
# the generated accessor is the one place that reads the system's var.
exempt_prefixes = ["code/modules/unit_tests/", "code/__defines/verdigris/", "code/engine/_generated/"]

[lint.base_vars.lists]
# base_vars_lint.py: `list_init` takes allow_annotations.exempt_path() (EXEMPT_DIRS and EXEMPT_FILES: unit
# tests and benchmarks build the forbidden things on purpose, the vendored tgstation-server DMAPI is kept
# verbatim). `base_var` counts every path, so these are lists the rule reads, not whole-lint exemptions.
list_init_exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/", "code/modules/tgs/"]
list_init_exempt_files = ["code/__defines/tgs.dm"]

[lint.decl]
# decl_lint.py EXEMPT: tests and benchmarks build the forbidden things on purpose. (No TGS exemption here:
# decl_lint.py never read exempt_path().) owned_vars() still reads these files (cx.all_files()).
exempt_prefixes = ["code/modules/unit_tests/", "code/modules/benchmarks/"]

[lint.init]
# init_lint.py EXEMPT_PREFIXES: unit tests, the engine's test fixtures and benchmarks build worlds on purpose. This only exempts the
# per-file rules (initialize, late_initialize, world_reads, turf_on_materialize): table_init_overrides
# reads every file (cx.all_files()), as init_lint.py's table pass did. (No TGS exemption: init_lint.py never
# read exempt_path().)
exempt_prefixes = ["code/modules/unit_tests/", "code/tests/", "code/modules/benchmarks/"]
# The codes an ALLOW(init/CODE) keep may carry (the lint holds the same list: tools/analyze/src/lints/init.rs REASON_CODES).
reason_codes = ["INSTANCE_STATE", "CTOR_ARGS", "FRAMEWORK"]

