name: Run Linters

on:
  workflow_call:

jobs:
  linters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      # Caches
      - name: Restore SpacemanDMM cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/SpacemanDMM
          key: ${{ runner.os }}-spacemandmm-${{ hashFiles('dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-spacemandmm-
      - name: Setup Bun
        uses: ./.github/actions/setup_bun
      - name: Restore Bootstrap cache
        uses: actions/cache@v5.0.5
        with:
          path: tools/bootstrap/.cache
          key: ${{ runner.os }}-bootstrap-${{ hashFiles('tools/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bootstrap-
      - name: Restore Rust cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('tools/ci/ci_dependencies.sh')}}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Restore verdigris build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verdigris -> target
          shared-key: verdigris-lint
      # End Caches
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.x
      - name: Install OpenDream
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "OpenDreamProject/OpenDream"
          tag: "latest"
          fileName: "DMCompiler_linux-x64.tar.gz"
          extract: true
      - name: Verify OpenDream compiler version for DM health
        run: echo '934b817004fc3979a65b9fc1eb87bbbd36bed804c94e7da3b9620cc160e6745c  DMCompiler_linux-x64/DMCompiler.dll' | sha256sum --check
      - name: Install Tools
        run: |
          pip3 install setuptools
          bash tools/ci/install_spaceman_dmm.sh dreamchecker
          bash tools/ci/install_ripgrep.sh
          tools/bootstrap/python -c ''
      - name: Give Linters A Go
        id: linter-setup
        run: ":"
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build DM health analyzer
        run: cargo build --release --manifest-path tools/dm-health/Cargo.toml
      - name: Run DM health and CI checks
        run: tools/dm-health/target/release/dm-health ci-suite
      - name: Upload DM health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm-health-report
          path: tools/dm-health/target/latest-report.json
          if-no-files-found: ignore
