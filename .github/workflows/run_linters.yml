name: Run Linters

on:
  workflow_call:

jobs:
  linters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      # Caches
      - name: Restore SpacemanDMM cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/SpacemanDMM
          key: ${{ runner.os }}-spacemandmm-${{ hashFiles('dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-spacemandmm-
      - name: Setup Bun
        uses: ./.github/actions/setup_bun
      - name: Restore Bootstrap cache
        uses: actions/cache@v5.0.5
        with:
          path: tools/bootstrap/.cache
          key: ${{ runner.os }}-bootstrap-${{ hashFiles('tools/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bootstrap-
      - name: Restore Rust cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('tools/ci/ci_dependencies.sh')}}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Restore verdigris build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verdigris -> target
          shared-key: verdigris-lint
      # End Caches
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 9.x
      - name: Install OpenDream
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "OpenDreamProject/OpenDream"
          tag: "latest"
          fileName: "DMCompiler_linux-x64.tar.gz"
          extract: true
      - name: Install Tools
        run: |
          pip3 install setuptools
          bash tools/ci/install_spaceman_dmm.sh dreamchecker
          bash tools/ci/install_ripgrep.sh
          tools/bootstrap/python -c ''
      - name: Give Linters A Go
        id: linter-setup
        run: ":"
      - name: Ensure genesis_call.dme is unchanged
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: bash tools/ci/check_genesis.sh
      - name: Run Grep Checks
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: bash tools/ci/check_grep.sh
      # Ticked File Enforcement stays disabled: it requires the .dme include list to
      # be in strict "ticked" (sorted) order and every unit-test file to be ticked,
      # neither of which this fork's deepquarry.dme / _unit_tests.dm follow. Enabling
      # it would require a large, define-order-sensitive reorder of the .dme. The
      # "every .dm is wired in" guarantee is already provided by ValidateDmeTarget.
      - name: Run Define Sanity Checks
        run: tools/bootstrap/python -m define_sanity.check
      - name: Run DreamChecker
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        shell: bash
        run: |
          set -o pipefail
          ~/dreamchecker 2>&1 | bash tools/ci/annotate_dm.sh
      - name: Run OpenDream
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        # pipefail so a non-zero DMCompiler exit (compile errors) fails the step
        # instead of being swallowed by the pipe to the annotator.
        shell: bash
        run: |
          set -o pipefail
          ./DMCompiler_linux-x64/DMCompiler deepquarry.dme --suppress-unimplemented --define=CIBUILDING | bash tools/ci/annotate_od.sh
      - name: Run Map Checks
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: |
          tools/bootstrap/python -m mapmerge2.dmm_test
          tools/bootstrap/python -m tools.maplint.source
      - name: Run DMI Tests
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: tools/bootstrap/python -m dmi.test
      # "Check File Directories" was removed: tools/ci/check_filedirs.sh no longer
      # exists, and its job (every code/ .dm reachable from the .dme) is enforced by
      # the active ValidateDmeTarget in tools/build/build.ts (run on every build).
      - name: Check Changelogs
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: bash tools/ci/check_changelogs.sh
      - name: Check Miscellaneous Files
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: bash tools/ci/check_misc.sh
      - name: Run TGUI Checks
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        run: tools/build/build.sh --ci lint tgui-test

      - name: Setup Rust toolchain for verdigris
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Linting is scoped to verdigris-the-crate (not the whole workspace) so vendored
      # auxmos stays on upstream's lint level. See verdigris/atmos/UPSTREAM.md.
      - name: Verdigris cargo fmt
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        working-directory: verdigris
        run: cargo fmt --package verdigris --check
      - name: Verdigris cargo clippy
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        working-directory: verdigris
        run: cargo clippy --package verdigris --all-targets -- -D warnings
      - name: Verdigris cargo test
        if: steps.linter-setup.conclusion == 'success' && !cancelled()
        working-directory: verdigris
        run: cargo test --package verdigris

      - name: Run Nanomap Checks
        run: tools/github-actions/nanomap-renderer-invoker.sh --testing
