name: CI Suite

# Runs on every push to master, on pull requests, in the merge queue, and on
# demand from the Actions tab. See doc/testing.md for what each job covers and
# how to run the same checks locally.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - "project/**"
  merge_group:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start_gate:
    if: ( !contains(github.event.head_commit.message, '[ci skip]') )
    name: Start Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Mandatory Empty Step
        run: exit 0

  run_linters:
    name: Run Linters
    needs: start_gate
    uses: ./.github/workflows/run_linters.yml

  run_unit_tests:
    name: Unit Tests
    needs: start_gate
    uses: ./.github/workflows/run_integration_tests.yml
    with:
      max_required_byond_client: 516

  run_compile_checks:
    name: Compile Checks
    needs: start_gate
    uses: ./.github/workflows/run_compile_checks.yml
    with:
      max_required_byond_client: 516

  completion_gate: # Serves as a non-moving target for branch rulesets
    if: always() && !cancelled()
    name: Completion Gate
    needs: [run_unit_tests, run_compile_checks, run_linters]
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
