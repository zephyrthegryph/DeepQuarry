name: Compile Checks

# Compiles the production Southern Cross build (the unit tests use the small
# test map, so this is the only job that compiles the live map), checks the
# client version it requires, and compiles every map template under MAP_TEST.
# The production step compiles without CIBUILDING/UNIT_TESTS, so a test-only type
# referenced outside its guard (e.g. by generated code) fails here.
#
# Both compile with the native compiler (tools/dmb), the compiler every local build uses.
# The second job is the DreamMaker cross-check: it compiles the production dme and the
# unit-test dme with DreamMaker and with the native compiler and fails on any difference
# between the two worlds (tools/ci/dm_equiv.sh, tools/dmb/crates/dmb-equiv/EQUIVALENCE.md).
on:
  workflow_call:
    inputs:
      major:
        required: false
        type: string
      minor:
        required: false
        type: string
      max_required_byond_client:
        required: true
        type: string

jobs:
  compile_checks:
    name: Compile Checks (${{ inputs.major && format('{0}.{1}', inputs.major, inputs.minor) || 'default BYOND' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The native compiler builds inside the workspace so the cache below holds it.
      DQ_DMBC_BUILD_DIR: ${{ github.workspace }}/tools/dmb/target

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Restore analyze build cache (every DM build runs `analyze gen` first)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/analyze -> target
          shared-key: analyze-gen
      - name: Restore native compiler build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/dmb -> target
          shared-key: dmbc-native
      - name: Ensure +x on CI directory
        run: |
          chmod -R +x ./tools/ci
      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}
      - name: Compile production build (Southern Cross)
        run: tools/ci/compile_and_run.sh
        env:
          TEST_BUILD: "0"
          EXTRA_ARGS: ""
          RUN: "0"
      - name: Check client compatibility
        uses: tgstation/byond-client-compatibility-check@v3
        with:
          dmb-location: deepquarry.dmb
          max-required-client-version: ${{ inputs.max_required_byond_client }}
      - name: Compile map templates
        run: tools/ci/compile_and_run.sh
        env:
          EXTRA_ARGS: "-DMAP_TEST"
          RUN: "0"

  dreammaker_cross_check:
    name: DreamMaker cross-check (${{ inputs.major && format('{0}.{1}', inputs.major, inputs.minor) || 'default BYOND' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DQ_DMBC_BUILD_DIR: ${{ github.workspace }}/tools/dmb/target

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Restore analyze build cache (every DM build runs `analyze gen` first)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/analyze -> target
          shared-key: analyze-gen
      - name: Restore native compiler build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/dmb -> target
          shared-key: dmbc-native
      - name: Ensure +x on CI directory
        run: |
          chmod -R +x ./tools/ci
      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}
      - name: Compile the production and the unit-test dme with DreamMaker and with native, and compare the worlds
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          cp config/example/* config/
          mkdir -p data/spritesheets
          bash tools/ci/dm_equiv.sh
      - name: Upload the comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm-equiv-reports
          path: |
            data/dm_equiv/*.report.txt
            data/dm_equiv/*.report.json
          if-no-files-found: ignore
          retention-days: 30
