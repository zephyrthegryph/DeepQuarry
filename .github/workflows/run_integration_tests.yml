name: Run Integration Tests

on:
  workflow_call:
    inputs:
      defines:
        description: "Extra -D defines, e.g. -DCITESTING_FULL_MAP to test on Southern Cross"
        required: false
        type: string
        default: ""
      label:
        required: false
        type: string
        default: "test map"
      major:
        required: false
        type: string
      minor:
        required: false
        type: string
      max_required_byond_client:
        required: true
        type: string

jobs:
  run_integration_tests:
    name: Run Tests (${{ inputs.major && format('{0}.{1}; ', inputs.major, inputs.minor) || '' }}${{ inputs.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure +x on CI directory
        run: |
          chmod -R +x ./tools/ci
      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}
      - name: Install 32-bit toolchain deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install -y gcc-multilib zlib1g-dev:i386
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verdigris -> target
          shared-key: verdigris-i686-linux
      - name: Build verdigris
        run: bash verdigris/build-linux.sh
      - name: Verify libverdigris.so
        run: ldd libverdigris.so
      - name: Install rust-g
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install -o APT::Immediate-Configure=false zlib1g-dev:i386 libssl-dev:i386 curl:i386
          bash tools/ci/install_rust_g.sh
      - name: Unit Tests
        id: run_tests
        run: tools/ci/compile_and_run.sh
        env:
          EXTRA_ARGS: "-DUNIT_TESTS ${{ inputs.defines }}"
          RUN: "1"
      - name: On test fail, write a step summary
        if: always() && steps.run_tests.outcome == 'failure'
        run: |
          # Get a JSON array of failed unit tests
          FAILED_UNIT_TESTS=$(jq 'to_entries | map(.value | select(.status == 1))' data/unit_tests.json)

          FAIL_COUNT=$(echo $FAILED_UNIT_TESTS | jq 'length')

          echo "# Test failures" >> $GITHUB_STEP_SUMMARY
          echo "$FAIL_COUNT tests failed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for i in $( seq $FAIL_COUNT ); do
            CURRENT_FAIL=$(echo $FAILED_UNIT_TESTS | jq --arg i $i '.[($i | tonumber) - 1]')

            TEST=$(echo $CURRENT_FAIL | jq --raw-output '.name')

            echo "### $TEST" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo $CURRENT_FAIL | jq --raw-output '.message' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.label }}${{ inputs.major && format('-{0}.{1}', inputs.major, inputs.minor) || '' }}
          path: |
            data/unit_tests.json
            data/logs/ci/
          if-no-files-found: ignore
          retention-days: 30
