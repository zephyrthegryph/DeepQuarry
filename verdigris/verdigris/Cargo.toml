[package]
name = "verdigris"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
const_format = "0.2.33"
meowtonin = "0.3.1"
rand = "0.10.1"
rand_distr = "0.6"
rayon = "1.10.0"

# Auxmos (vendored, rlib) is linked into libverdigris.so. See verdigris/atmos/UPSTREAM.md
# and modular_dq/doc/atmos_migration.md decision §1, §5, §6 for feature selection.
#
# Gated on target_arch = "x86" because byondapi-sys is 32-bit-only by design.
# Host-arch `cargo check` / `cargo test` skip auxmos; the i686 release build
# (verdigris/build-linux.sh / build-windows.sh, and CI integration tests) is
# the real validation.
[target.'cfg(target_arch = "x86")'.dependencies]
# superconductivity: DISABLED. code/atmos/src/turfs/superconduct.rs is unported
# auxtools-era code (byondapi_hooks::bind, magic `src`, #[init(partial)]/#[shutdown],
# src.raw.data.id, auxtools::ByondValue::world/globals, src.read_number("..")). It
# does NOT compile under byondapi 0.4.x and was never built (the last successful .so
# predates this feature being added). Enabling it needs a full byondapi port of that
# file PLUS DM wiring (a process_turf_heat SSair step, turf thermal_conductivity/
# heat_capacity/initial_temperature vars, and a return_temperature turf hook). That
# is a self-contained subsystem project — left off so the build is green and matches
# the running library. See doc/auxmos_cutover_status.md. reaction_hooks stays OFF too
# (reactions run in DM — see doc/auxmos_wiring_plan.md).
auxmos = { path = "../atmos", default-features = false, features = ["turf_processing", "katmos", "katmos_slow_decompression"] }

[build-dependencies]
bosion = "2.0.0"
