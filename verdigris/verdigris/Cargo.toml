[package]
name = "verdigris"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

# The DLL itself: it links the binds (vg-ffi) and the gas domain (vg-gas) and sets
# the global allocator. byondapi-sys is 32-bit only, so those links are gated on
# target_arch = "x86"; a host build of this crate is just material_power and its
# tests. See verdigris/README.md for the crate map.

[dependencies]
eyre = { workspace = true }

[target.'cfg(target_arch = "x86")'.dependencies]
# Gas features: turf_processing (diffusion + decompression, turfs/processing.rs).
# The heat domain (M4) is vg-ffi's own binds (ffi/src/heat.rs) over vg-heat and
# vg_core::world::World, not a vg-gas feature. Reactions run in DM (see
# code/ATMOSPHERICS/README.md).
vg-gas = { path = "../domains/gas", default-features = false, features = ["turf_processing"] }
vg-ffi = { path = "../ffi" }
# material_power.rs still carries its own binds (it belongs to another session and
# moves to vg-ffi / the power domain with its owner's agreement).
byondapi = { workspace = true }
auxmacros = { path = "../ffi/macros" }
# Pulled in transitively by every `#[auxmacros::bind]` expansion (the panic guard
# lives in auxcallback::panic_guard); material_power.rs uses the bind macro, so this
# crate needs the dependency too. Mechanical addition, not a material_power.rs edit.
auxcallback = { path = "../ffi/callback" }
