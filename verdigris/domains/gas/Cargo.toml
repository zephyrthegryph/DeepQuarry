# auxmos — vendored from https://github.com/Putnam3145/auxmos
# See UPSTREAM.md for the pinned commit and DQ-specific modifications.

[package]
# Renamed from `auxmos` when it became the gas domain crate (R1). Exported FFI
# symbol names (auxmos_*) are unchanged.
name = "vg-gas"
version = "2.3.0"
authors = ["Putnam <putnam3145@gmail.com>"]
edition = "2021"

[features]
default = ["turf_processing"]
turf_processing = []

[lib]
# DQEdit: was ["cdylib"] upstream; we link auxmos into libverdigris.so as an rlib
# so BYOND loads exactly one library. See code/ATMOSPHERICS/README.md.
crate-type = ["rlib"]

[dependencies]
eyre = { workspace = true }
vg-core = { path = "../../core" }
itertools = "0.14.0"
float-ord = "0.3.2"
parking_lot = "0.12.3"
rustc-hash = "2.1.0"
ahash = "0.8.11"
hashbrown = "0.15.2"
atomic_float = "1.1.0"
bitflags = "2.6.0"
# DQEdit: mimalloc removed — the global allocator is set in the cdylib (verdigris) crate, not here.


[dev-dependencies]
proptest = "1.5"

[dependencies.tinyvec]
version = "1.8.1"
features = ["rustc_1_61", "alloc"]

# DQEdit: panic = "abort" removed — the cdylib (verdigris) inherits the workspace's
# unwind strategy so panic_safe! can catch panics across the FFI boundary.
