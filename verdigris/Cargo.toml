[workspace]
resolver = "2"
# Crate map (see README.md and doc/rewrite/rust_core.md):
#   core/            vg-core    domain-agnostic primitives; host-buildable, no byondapi, no global statics
#   domains/gas/     vg-gas     gas arena, turf diffusion, heat binds (vendored auxmos); i686 only for now
#   domains/heat/    vg-heat    heat domain (M4): turf solid field, bodies, couplings; host-buildable
#   gen/layout/      vg-layout  procedural generator (station layout planner + cave generator); not a sim domain, host-buildable
#   ffi/             vg-ffi     BYOND binds (byondapi); i686 only
#   ffi/macros       auxmacros  panic_safe bind attribute (proc macro)
#   ffi/callback     auxcallback  deferred callbacks to the BYOND main thread; i686 only
#   verdigris/       verdigris  the DLL
#   tools/bench/     vg-bench   criterion benchmarks
#   tools/replay/    vg-replay  replays a flight-recorder log and verifies state hashes
members = [
    "core",
    "domains/gas",
    "domains/heat",
    "gen/layout",
    "domains/power",
    "ffi",
    "ffi/macros",
    "ffi/callback",
    "verdigris",
    "tools/bench",
    "tools/replay",
]
# byondapi-sys only builds for 32-bit targets, so a plain host `cargo test` / `cargo
# check` covers the host-buildable crates. The i686 release build
# (build-{linux,windows}.sh) builds the DLL and everything it links; gas tests run
# with `cargo test --target i686-pc-windows-msvc -p vg-gas` (or i686-unknown-linux-gnu).
default-members = ["core", "domains/heat", "gen/layout", "domains/power", "verdigris", "tools/bench", "tools/replay"]

# Shared by the gas domain and the FFI crates (auxmos was originally its own
# workspace; see domains/gas/UPSTREAM.md).
[workspace.dependencies]
# byondapi git-main (0.6.x, default feature byond-516-1682): the modern 516 ABI —
# buffer-based Byond_LastError (no LastError deref crash) and correct 516 reference
# handling (temp refs / DecTempRef / persistent off-thread refs). This targets BYOND
# 516.1682+, which is why the runtime image is pinned to 516.1682 (see the Dockerfile /
# build-*.sh). Pinned to a rev because 0.6.x is not yet published to crates.io; revisit
# and switch to a crates.io version once one lands. Replaced the old vendored 0.4.11 +
# LastError patch and the intermediate 0.5.14 attempt (0.5.14's 516-1651 needs a runtime
# with DecTempRef but the *pointer* LastError — no single BYOND build satisfies both).
byondapi = { git = "https://github.com/spacestation13/byondapi-rs", rev = "721dd4690b60954687e41d8691d0040f398d91a6" }
coarsetime = "0.1.35"
flume = "0.11.1"
eyre = "0.6.12"
tracing = "0.1.41"

[profile.release]
debug = "full"
lto = "thin"
split-debuginfo = "packed"
# Must be "unwind" (the default) so #[auxmacros::panic_safe] can catch panics
# across the FFI boundary. Auxmos's original "abort" was removed when vendoring.

# Benches only need optimized code, not the DLL's LTO and full debug info,
# which made every bench build relink the whole workspace slowly.
[profile.bench]
inherits = "release"
lto = false
debug = "line-tables-only"
incremental = true

[profile.dev]
debug = "full"
opt-level = 0
