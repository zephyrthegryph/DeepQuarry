[package]
name = "vg-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Domain-agnostic simulation primitives for verdigris. Host-buildable: no byondapi, no global statics."

[dependencies]
# The frame pool (rust_core.md section 3.7) is a dedicated rayon ThreadPool.
rayon = "1.10.0"

[features]
default = ["rayon"]
# Parallel iteration over `Arena`.
rayon = []

[dev-dependencies]
proptest = "1.5"
