# auxmos — vendored from https://github.com/Putnam3145/auxmos
# See UPSTREAM.md for the pinned commit and DQ-specific modifications.

[package]
name = "auxmos"
version = "2.3.0"
authors = ["Putnam <putnam3145@gmail.com>"]
edition = "2021"

[features]
# DeepQuarry: defaults intentionally avoid `katmos` so we can opt in via verdigris's
# feature selection. Q6: reaction_hooks left available but verdigris does not enable it.
default = ["turf_processing"]
zas_hooks = []
turf_processing = []
superconductivity = ["turf_processing"]
fastmos = ["turf_processing"]
katmos = ["fastmos"]
katmos_slow_decompression = ["fastmos"]
reaction_hooks = []
citadel_reactions = ["reaction_hooks"]
yogs_reactions = ["reaction_hooks"]

# Tracing exposes a local port — opt-in only.
tracy = ["dep:tracing-tracy", "dep:tracing-subscriber", "dep:tracing"]

[lib]
# DQEdit: was ["cdylib"] upstream; we link auxmos into libverdigris.so as an rlib
# so BYOND loads exactly one library. See modular_dq/doc/atmos_migration.md decision §4.
crate-type = ["rlib"]

[dependencies]
byondapi = { workspace = true }
flume = { workspace = true }
coarsetime = { workspace = true }
eyre = { workspace = true }
auxcallback = { path = "./crates/auxcallback" }
auxmacros = { path = "./crates/auxmacros" }
itertools = "0.14.0"
rayon = "1.10.0"
float-ord = "0.3.2"
parking_lot = "0.12.3"
rustc-hash = "2.1.0"
ahash = "0.8.11"
indexmap = { version = "2.5.0", features = ["rayon"] }
dashmap = { version = "6.1.0", features = ["rayon"] }
hashbrown = "0.15.2"
atomic_float = "1.1.0"
petgraph = "0.7.0"
bitflags = "2.6.0"
nom = "7.1.3"
# DQEdit: mimalloc removed — the global allocator is set in the cdylib (verdigris) crate, not here.

tracing = { version = "0.1.41", optional = true }
tracing-tracy = { version = "0.11.4", optional = true }
tracing-subscriber = { version = "0.3.19", optional = true }

[dependencies.tinyvec]
version = "1.8.1"
features = ["rustc_1_61", "alloc"]

# DQEdit: panic = "abort" removed — the cdylib (verdigris) inherits the workspace's
# unwind strategy so panic_safe! can catch panics across the FFI boundary.
