author: "Codex"
delete-after: true
changes:
  - bugfix: "Machine actions, item prompts, paperwork, library terminals and payment devices now use the acting player consistently."
  - bugfix: "Cryo tubes correctly finish seating and buckling a newly inserted patient."
  - bugfix: "Ticket actions refuse invalid authorization levels and stale escalation requests."
  - bugfix: "Biopsy reports reach the scanner user after printing, and invalid beams stay stopped."
  - bugfix: "Marker beacon pickup no longer duplicates beacons when both hands are full."
  - bugfix: "Timed implant installation preserves the installer for configuration and size-control ownership."
  - bugfix: "Completed machine and console frames correctly transfer their installed circuit board."
  - bugfix: "Gun scopes and binoculars use the acting player and correct viewing parameters."
  - bugfix: "Gun cleanup no longer fails when its holder has no active aim."
  - bugfix: "Machine frames keep all inserted stock parts in their owned component list."

  - bugfix: "Fax requests and resizing feedback preserve the acting player through confirmation prompts."
  - bugfix: "Destroyed capture crystals release their captured creatures and respect stuck items."
  - bugfix: "Destroyed ghost traps release their occupants, and deleted shooting targets restore their stakes."
  - bugfix: "Corporate tags survive destruction of synthmorph body bags."
  - bugfix: "Destroyed stasis cages and reversible gargoyle statues release their occupants and restore normal movement and biological time."
  - admin: "Goo trap reports identify the creature that actually triggered the trap."
  - bugfix: "Deleted closed clamps restore pipe flow, and closed storage displays release their item labels and pins."
  - bugfix: "Hailer mask assemblies and selection kits preserve ingredients on refusal without dropping unrelated held items."
  - bugfix: "Gun boxes and folded body bags preserve their contents without creating duplicate products when removal is refused."
