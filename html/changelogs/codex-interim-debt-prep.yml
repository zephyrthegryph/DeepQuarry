author: "Codex"
delete-after: true
changes:
  - bugfix: "Machine actions, item prompts, paperwork, library terminals and payment devices now use the acting player consistently."
  - bugfix: "Cryo tubes correctly finish seating and buckling a newly inserted patient."
  - bugfix: "Ticket actions refuse invalid authorization levels and stale escalation requests."
  - bugfix: "Biopsy reports reach the scanner user after printing, and invalid beams stay stopped."
  - bugfix: "Marker beacon pickup no longer duplicates beacons when both hands are full."
  - bugfix: "Timed implant installation preserves the installer for configuration and size-control ownership."
  - bugfix: "Completed machine and console frames correctly transfer their installed circuit board."
  - bugfix: "Gun scopes and binoculars use the acting player and correct viewing parameters."
  - bugfix: "Gun cleanup no longer fails when its holder has no active aim."
  - bugfix: "Machine frames keep all inserted stock parts in their owned component list."

  - bugfix: "Fax requests and resizing feedback preserve the acting player through confirmation prompts."
  - bugfix: "Capture crystals respect stuck-item refusal when releasing captured creatures."
  - bugfix: "Deleted shooting targets restore their stakes."
  - admin: "Goo trap reports identify the creature that actually triggered the trap."
  - bugfix: "Hailer mask assemblies and selection kits preserve ingredients on refusal without dropping unrelated held items."
  - bugfix: "Gun boxes and folded body bags preserve their contents without creating duplicate products when removal is refused."
  - bugfix: "Stasis-bag injector loading and concealed-knife assembly respect stuck ingredients and preserve inventory bookkeeping."
  - bugfix: "Locket and television assembly insertions respect stuck ingredients and preserve unrelated held items."
  - bugfix: "Grenade and microscope sample insertion respect stuck items; turret sensors and firedoor boards advance construction only after consumption succeeds."
  - bugfix: "DNA analyzers respect sticky sample removal without losing donor data."
  - admin: "Admin fax logo prompts follow the invoking administrator."
  - bugfix: "pAI folding safely handles a missing personality card."
  - bugfix: "Floor-light kits respect sticky-item refusal before creating fixtures."
  - bugfix: "PDA signaller transmissions retain actor-aware logging and their existing cooldown."
  - bugfix: "Automatic signaller beeps and delayed appearance feedback use their actual recipients."
  - bugfix: "Clown eggs preserve the operator warning and administrative attribution when triggered."
  - admin: "Ghost-pod completion feedback retains the original opener across volunteer selection."
  - bugfix: "Accessory registries retain all registered modifiers."
  - bugfix: "Magic staves check the actual shooter's null rod before spending ammunition."
  - bugfix: "Camera wire cutting and mending retain the initiating operator."
  - bugfix: "Air-alarm wire cutting and mending retain the initiating operator."
  - bugfix: "Particle-accelerator wire actions retain their operator and safely log ambient changes."
  - admin: "Broadcast email delivery retains the initiating sender across scheduled relays."
  - bugfix: "Picnic blankets release their held source before unfolding and preserve inventory when removal is refused."
  - bugfix: "Broadcast emails retain queued messages until delivery and discard failed or cancelled clones."
  - admin: "Vote startup retains the initiating administrator through the vote service."
  - bugfix: "Rigged crates shock the actual opener, including an occupant trying to escape."
  - bugfix: "Modular computers retain the user for program access checks, autorun and delayed quit feedback."
  - bugfix: "Computer drives retain their default and added files in a searchable owned file list."
  - bugfix: "Stool dismantling preserves items that cannot be released and returns materials only on success."
  - bugfix: "Direct file transfers update the original drive capacity as well as the destination."
  - admin: "Administrative paper editing uses its intended writer and retains the editing user."
  - bugfix: "Supply talisman choices retain the invoking user across successive selections."
  - admin: "Event selection retains the user through queued choices."
  - admin: "Variable-viewer type prompts retain the editing user."
  - bugfix: "Cutting bedsheets and refastening signs preserve items that cannot be released."
  - bugfix: "Surplus vouchers preserve items that cannot be released and deliver rewards only after successful consumption."
  - bugfix: "HUD controls retain the clicking user and safely ignore unsupported robot controls."
  - bugfix: "Speech bubbles stay alive until their cleanup timer and are removed even after their speaker disappears."
  - bugfix: "Legacy item action buttons pass the clicking player to the item action."
  - bugfix: "Toy sword and shoe appearance changes redraw their actual holder instead of an unrelated player."
  - admin: "Filter editor choices and permission checks retain the editing player."
  - bugfix: "Girder resets no longer stack reinforcement strength, and removing struts restores the frame material strength."
  - admin: "SDQL parsing, query variables and diagnostics retain the requesting player."
  - bugfix: "Machine frames refuse unreleasable circuit boards without advancing construction."
  - bugfix: "Refused transfers into full storage preserve the source item display."
  - bugfix: "Diagonal inventory controls act on the client mob consistently."
  - bugfix: "Empty meal packages that cannot be released no longer disappear or create duplicate wrapper trash."
  - admin: "Media track controls retain the editing player through rights checks and prompts."
  - bugfix: "Dismantling a grave marker that cannot be released preserves it without refunding material."
  - bugfix: "Ghost-role replies retain the observer who received the question across asynchronous answers."
  - bugfix: "Welding a shard that cannot be released preserves it without duplicating sheets."
  - admin: "Gear dispenser editor prompts and rights checks retain the supplied player."
  - bugfix: "Dare-button jackpots preserve unreleasable buttons without duplicating prizes."
  - bugfix: "Ghost HUD choices retain the clicking observer across delayed prompt answers."
  - bugfix: "NIF resizing now applies the chosen size to its original owner without repeating activation costs."
  - bugfix: "Removing an implant safely cleans up its installed NIF software."
  - bugfix: "Airlocks now read cut-wire states from their actual wires capability."
  - bugfix: "One-use custom injectors require their source to be released before changing the user."
  - bugfix: "Animal digestion choices retain their selecting actor after the prompt."
  - bugfix: "Special operations countdowns retain their actor and clean up blocked-launch radios."
  - bugfix: "Cell bays respect source release rules and preserve inventory bookkeeping during insertion."
  - admin: "Ban validation and player-note reports retain their supplied actor."
  - bugfix: "Emagging an unopened atmos console creates and subverts its controller safely."
  - admin: "Delayed Highlander and redspace actions retain their initiating actor, and artillery reports its actual user."
  - bugfix: "Rechargers and heavy-duty cell chargers respect source release rules and preserve returned cells."
  - bugfix: "Gun HUD controls update the clicking actor consistently."
  - admin: "Save PNG delivers the object image to the invoking client explicitly."
  - bugfix: "Washers respect dye release rules and return dye when opened."
  - bugfix: "Nuclear authentication insertion respects held disk release rules."
  - bugfix: "Clonepods respect container release rules after loading delays."
  - bugfix: "Camera upgrades respect release restrictions and can be removed after first insertion."
  - bugfix: "Biogenerators respect produce release rules and clear bag display state during bulk transfer."
  - bugfix: "Seed extraction produces seeds only after successful input consumption."
  - admin: "Note deletion retains the initiating actor and flushes saved notes safely."
  - bugfix: "Pipe recycling credits metal only after successful consumption."
  - bugfix: "Newscaster photo replacement preserves the current attachment when the new photo cannot be released."
  - bugfix: "Gaiters respect mask release rules and return their previous mask during replacement."
  - bugfix: "Cistern insertion respects held item release rules."
  - bugfix: "Gift unwrapping preserves its present when the wrapper cannot be released."
  - bugfix: "Technomancer cores equip and remove their ability buttons without cleanup failures."
  - bugfix: "Pneumatic cannons respect held tank release rules."
  - bugfix: "Fluid pumps respect held power-cell release rules."
  - bugfix: "Kinetic accelerators respect held modkit release rules."
  - bugfix: "Linen bins respect held bedsheet and hidden-item release rules."
  - bugfix: "Coatracks respect held coat release rules."
  - bugfix: "Target stakes respect held target release rules before pinning."
  - bugfix: "Energy shields redraw the hands of their actual holder."
  - bugfix: "Food carts, safes, anomaly utilizers and money bags respect held-item release rules."
  - bugfix: "Safe retrieval refunds the removed item's occupied capacity."
  - bugfix: "Energy melee weapons redraw their actual holder's hands."
  - bugfix: "Artifact harvesters respect held-battery release rules."
  - bugfix: "Monkey rehydrators and microwaves respect items that cannot leave your hand."
  - bugfix: "ATMs respect stuck IDs, and message server upgrades require consuming their board."
  - bugfix: "ATM deposits require consuming cash, and stuck hailer masks and electrohelmets retain their parts when disassembly is refused."
  - bugfix: "Sandwiches and custom food plates preserve stuck ingredients and their reagents; stuck pet cubes cannot create duplicate pets."
  - bugfix: "Teleporter coordinate cards must be consumed before granting a destination."
  - bugfix: "Photocopiers and fax machines require consuming a toner cartridge before receiving its supply."
  - bugfix: "PDAs and clipboards respect pens and paper that cannot leave your hand."
  - bugfix: "Paper bins respect stuck sheets, and camera refills require consuming their film."
  - bugfix: "Chained shoes, paper bundles and filing cabinets respect stuck items; strange rocks retain concealed finds when release is refused."
  - bugfix: "Holographic swords redraw the hands of their actual holder."
  - bugfix: "Service fabricator refills and contraband unwrapping require consuming their original cartridge or package."
  - bugfix: "Cat boxes respect release rules; floorlayers preserve stuck tiles and avoid merging stacks into themselves."
  - bugfix: "Power-cell mode swaps respect stuck cells and preserve their charge and persistence setting."
  - bugfix: "Slime extract enhancers and floor-lamp shades must be consumed before granting extra uses or a refundable shade."
  - bugfix: "Mimic potions, ore boxes and solar tracker upgrades require consuming their original item before granting its result."
  - bugfix: "Ban removal preserves the selected administrator across confirmation, and automatic expiry works without a player actor."
  - bugfix: "Paper shredders and mining shield upgrades require consuming their original document or disk before granting output or stronger protection."
  - bugfix: "Completed shuttle console construction retains the correct builder in administrator logs."
  - bugfix: "pAI power repairs and beehive assembly respect replacement parts and assemblies that cannot leave your hand."
  - bugfix: "Material armor respects release rules before shattering and clears its equipment slot when it does break."
  - bugfix: "Medical stands retain the chosen actor across patient prompts; ship confirmations recheck the original drag actor."
  - bugfix: "Deck and desk-toy pickup safely reject unsupported actors while preserving cards and toy state."
  - bugfix: "Stickers, deployable singularity beacons and reclaimed translocator beacons must be consumed before granting their result."
  - bugfix: "Paper-bin and sticky-pad pickup safely reject unsupported actors while preserving their paper stock."
  - bugfix: "Collar cracking and clipboard pen insertion respect items that cannot leave your hand."
  - bugfix: "Timed prosthetics species uploads must consume the original disk before adding its fabrication option."
  - bugfix: "Ashtray insertion and debug-printer paper loading respect items that cannot leave your hand."
  - bugfix: "RIG and mech air controls retain the actual wearer or pilot; backpack pickup checks the initiating actor."
  - bugfix: "Seismic-charge upgrades consume their original laser before granting stronger blast settings."
  - bugfix: "Returned paper cups must leave their holder before restoring dispenser stock."
  - bugfix: "Flamethrower recovery and sunflower seed harvesting respect sources that cannot leave your hand."
  - bugfix: "Glass jars and reconstitutors respect banknotes and paste that cannot leave your hand."
  - bugfix: "Material weapon shattering and bluespace crystal use respect release rules and clear consumed originals from hands."
  - bugfix: "Micro-mech boarding, powered backpack pickup and technomancer spell buttons use the initiating actor."
