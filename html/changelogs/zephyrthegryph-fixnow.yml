  - code_imp: "Ratchet lints: weak or unused ALLOW annotations are errors; sync SQL and usr outside verbs are ratcheted; tests, benchmarks and TGS are exempt by path; each site is counted once"
  - refactor: "Removed the never-instantiated /datum/belly"
