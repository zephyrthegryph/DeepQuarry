author: "zephyrthegryph"
delete-after: true
changes:
  - rscadd: "Vore-capable predators now hunt with a readable grapple sequence: a telegraphed tackle that knocks you down, a pin you can struggle out of, a reinforced grip that's much harder to escape, then the devour — and beating the predator off with a quick combo makes it bail. Predators only go for the grab once you're worn down (low or out of stamina), so it's a finisher you have to be ground into."
  - rscadd: "Packs now pincer you: the lord anchors its nearest members on you head-on and sends the rest to flank from the sides and rear instead of all piling onto one tile (ranged mobs hang back and harry)."
  - rscadd: "Simple mobs swap combat stances (aggressive / defensive / desperate) based on their health and how hard they're being pressured, shifting their behaviour and intent the way a player switches intents mid-fight."
  - rscadd: "String a combo on a mob and it reads the next telegraphed swing and dodges it — they stop standing there eating hits."
  - bugfix: "Quarry packs no longer detect you from across the layer or stay aggroed forever — the lord coordinates off what its members can actually see and stands the pack down once it loses sight."
  - bugfix: "Mobs standing next to you actually swing now instead of milling in place."
  - bugfix: "Swarming fauna no longer clobber their own packmates with telegraphed heavies."
  - bugfix: "Fixed an invisible belly overlay surviving a server restart and blocking clicks on the lobby/start menu; reconnecting while eaten still keeps your overlay."
  - balance: "Idle wildlife far from any player no longer runs a full vision scan every tick, keeping the AI fast on fauna-packed layers."
  - code_imp: "Removed the temporary AI player-tracing diagnostics that were writing to disk on the combat hot path."
  - rscadd: "Attack telegraphs are now colour-coded: yellow = parry/block it, red = unblockable (step out), blue = a grab (dodge or get grappled)."
  - rscadd: "Added a poise/stagger system: landing hits and especially parries break a target's guard, leaving them staggered wide open — the moment to execute them (or, against you, to get grappled)."
  - rscadd: "Added executions: a Harm swing on a staggered, downed, or grabbed opponent becomes a cinematic finisher, with flavour that varies by weapon."
  - rscadd: "Added a charged heavy (Wind Up Heavy Blow verb, and automatically after a parry): a slow, telegraphed, wide cleave that knocks back and shatters poise."
  - rscadd: "Targeted strikes now wound: hit a leg to slow them, an arm to spoil their offense (and disarm a player), or the head to daze them."
  - rscadd: "Shoving someone into another body now knocks both of them sprawling — works the same whether you shove a mob into its packmates or get shoved into one."
  - rscadd: "The grab system is now universal — any creature can grab, not just humans."
  - soundadd: "Combat now has impact, parry, guard-break, wounding, execution, and knockdown sound effects."
  - rscadd: "Quarry stalkers are now true ambush predators: they keep their distance and circle you, only committing to the kill when you're weakened (low HP/stamina, staggered, or downed) or you've strayed from your group."
  - bugfix: "Predator grapples now use the real grab system — you escape a pin the same way you break any grab (Resist), and it's hardest to break once reinforced."
  - balance: "Executions can no longer one-shot a player from a single broken state, and a stagger-break can't be chained into a perpetual stunlock."
  - bugfix: "Fixed several combat edge cases: a grab freeing a deleted prey, a predator's grip breaking from a packmate's stray hit, and pack flanking going haywire across quarry layers."
