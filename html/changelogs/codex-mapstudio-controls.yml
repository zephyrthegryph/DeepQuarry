author: "codex"
delete-after: true
changes:
  - qol: "Improved Map Studio selection, layer controls, camera movement, and tile editing."
  - bugfix: "Rendered mapped pipe and cable colors, offsets, and proposed atom changes."
  - bugfix: "Removed zoom flicker and square route markers from Map Studio."
  - qol: "Added a persistent tool palette, tile atom picker, S-key picking, and automatic network joining."
  - qol: "Made layer selection temporarily reveal hidden layers and added sprite-aware picking and a selection details panel."
  - bugfix: "Kept consecutive cable strokes together in a single map preview and reduced network preview delay."
  - qol: "Added shared network blueprints and selection outlines that follow sprite bounds."
  - qol: "Select connected map networks and extend them directly from the selected network."
  - bugfix: "Removed the selection flash and previewed updated network endpoints while drawing."
  - bugfix: "Joined new cable branches to existing powernets using shared cable directions."
  - qol: "Reworked layer editing and visibility controls and softened network selection and placement previews."
  - bugfix: "Made leftward cable extensions connect through the correct existing port."
  - qol: "Added nearest-sprite click tolerance and agent tools for rooms, fills, networks, and placement."
  - bugfix: "Kept wire endpoints under the pointer while dragging and selected connected segments in unsaved proposals."
  - qol: "Reduced live network preview work during continuous dragging."
  - bugfix: "Kept the live wire tip under the pointer and stopped distant selected cables from anchoring new routes."
  - qol: "Made connected network selection visibly highlight every selected segment."
  - bugfix: "Cached the map type catalog so wire drafts no longer rescan the whole map on every update."
  - bugfix: "Removed the temporary wire line and attached new cable branches through the existing port nearest the cursor."
  - bugfix: "Connected returning wire routes through the port they approach and used the pointer side for their final cable connection."
  - bugfix: "Preserved separate power cables at straight crossings and opposite corners instead of joining their ports."
  - qol: "Smoothed diagonal wire drags and recognized diagonal side connections when selecting and linting power networks."
  - qol: "Restricted cable endpoint joins to the network under the pointer and updated only changed draft tiles while drawing wires."
  - bugfix: "Required selecting a network before wire drags snap to it, kept unselected starts as nubs, and allowed routes to loop over earlier tiles."
  - qol: "Removed draft tile boxes and preloaded cable sprites to reduce preview flicker."
  - bugfix: "Kept wire sprites visible while their atlas loads and removed grid strokes that changed around draft tiles."
  - qol: "Made cable drawing and backtracking respond at tile borders and limited selected-network snapping to nearby wire ports."
  - bugfix: "Stopped wire proposals from replacing map sprite atlases, restored diagonal drawing, and allowed cable stubs over the center of an existing segment."
  - qol: "Balanced diagonal wire gestures so clear angles form diagonals while shallow drags stay cardinal."
  - bugfix: "Used drag-anchored tile nodes for wire direction, preserving straight drags, corner diagonals, and reverse tracing."
  - bugfix: "Kept diagonal cables when curving into a new direction, and made nearby corner targets easier to hit."
  - bugfix: "Kept wire placement and selected-network endpoints on the tile under the pointer until it crosses a tile border."
  - bugfix: "Kept the live wire tip on the pointer's tile while retracing diagonals."
  - bugfix: "Preserved deliberate cardinal wire turns such as up-right-up while keeping quick corner diagonals."
  - bugfix: "Restored diagonal wire drags while preserving deliberate straight turns."
  - rscadd: "Routed atmos and disposal drags through bends and supported three-way junction fittings."
  - refactor: "Moved mapped network route construction into a shared Rust core used by the editor and browser previews."
  - qol: "Rendered the map through a GPU viewport and added reusable Rust PNG preview compositing."
  - bugfix: "Kept earlier unsaved pipe and cable previews visible during new drags and stopped draft tiles from shimmering over GPU-rendered floors."
  - qol: "Made diagonal cable corners easier to draw and retracing diagonals through a side tile reliably undo the segment."
  - qol: "Fetched only newly revealed map tiles and loaded sprite atlases in smaller batches when panning."
  - rscadd: "Added a standalone R-UST reactor suite test map with prep, control, fuel, and coolant rooms."
