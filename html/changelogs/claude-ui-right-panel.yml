author: "claude"
delete-after: true
changes:
  - rscdel: "Removed menu entries and verbs that other controls already cover: Reconnect and Check ping (the chat box shows both), Quit (the window's close button), Float / dock chat (drag the chat to float or dock it), Export chat log (chat settings, Export: Save chat log), Submit TGUI feedback, and the Wiki/Forum/Rules/Map/GitHub/Discord/Patreon links."
  - admin: "Removed Enable/Disable Mapping Verbs (they only hid Set Server FPS, which is now always listed under dangerous debug tools); Possess Obj and Release Object moved from their own Object tab to Admin.Game."
  - rscadd: "The right panel has fewer tabs: Status, Actions and Game for everyone, plus Staff and Server for admins. Verbs sit in named groups that open and close (long and dangerous ones start closed; dangerous ones are red), tickets are on top of Staff with a count on the tab, and the MC panel, server tools and queries are pages of Server. Examining or inspecting something opens a card over the current view instead of switching tabs."
  - qol: "One search box for the whole panel: it finds verbs and Menu items, shows where each lives, runs the first match on Enter and is focused with /."
