author: "BigBadE"
delete-after: true
changes:
  - rscadd: "Research and Cargo can sell manufactured goods, materials, and stock directly to crewmembers through department-linked checkout scanners; the Research Director now receives a Research scanner."
  - refactor: "Centralized legacy account mutations through audited credit, debit, and transfer APIs so purchases, deposits, withdrawals, events, and retail sales participate in accounting and debt behavior."
  - rscadd: "Department heads can negotiate generic contract clauses before acceptance, choosing exact station, department, staff, reputation, and deadline tradeoffs through the management console."
  - bugfix: "Medical contract availability now reconciles after login, logout, and body-transfer state has settled."
  - refactor: "Contract evidence now follows physical papers, prunes orphaned records, and expires retained records after contract closure."
  - bugfix: "Mixed, transferred, injected, ingested, and blood-extracted trial medication now preserves proportional study provenance."
  - rscadd: "Patients can sign and fax ordinary-paper consent withdrawals; unsubmitted evidence is voided without recalling records already received."
  - code_imp: "CI now rejects direct medical-condition severity writes that bypass the authoritative mutation API."
  - refactor: "Contracts now use stable character identities and a shared, one-use evidence ledger."
  - rscadd: "Experimental medication leaves a coded tracer visible on authenticated body scans."
  - qol: "Medical contract dashboards now show tracer status, next steps, and replacement paperwork controls."
  - admin: "Added a contract inspector covering evidence, contributions, payments, and audit history."
  - rscadd: "Added event-driven contract infrastructure for station, department, and personal work agreements."
  - code_imp: "Added audited contract funding, escrow, contributions, hierarchical milestones, and faction reputation reward support."
  - rscadd: "Added randomized VeyMed experimental medication studies with signed consent, physical before-and-after body-scan evidence packets, outcome analysis, and Medical contract rewards."
  - rscadd: "Added event-driven personal contracts for patient advocacy, VeyMed consent cover-ups, industrial drug espionage, and irreversible-fatality corpse recovery."
  - refactor: "Replaced bespoke trial and delivery gadgets with a unified contract dashboard, faxed clinical paperwork, and cargo-shuttle manifests."
  - refactor: "Removed omniscient trial telemetry and manual result certification; VeyMed now authenticates bundled scanner printouts and trial drugs produce existing medical conditions with separate exposure provenance."
  - balance: "Routine VeyMed studies now use healthy cohorts; therapeutic and mixed studies are offered only while a station crewmember actually has the matching qualifying condition."
  - refactor: "Centralized medical-condition attachment and removal behind a signal-emitting API so condition-dependent contracts update immediately without polling."
  - bugfix: "Medical studies now require a genuinely fulfillable cohort, withdraw impossible unstarted studies without penalty, and correctly dispense supplies at the accepting console."
  - rscadd: "Medical contract offers now expire and renew, show their remaining time, and permit two budget-funded replacement doses."
  - rscadd: "Rare qualifying conditions now generate consented longitudinal case-report contracts using ordinary body scans, paper narratives, and fax submission."
  - balance: "Medical contract contributor pay now credits patients, enrolling clinicians, scan operators, and filing staff from authenticated actions."
  - rscdel: "Removed the unused standalone Contract Network backend and interface; department and PDA views now read directly from the contracts subsystem."
  - code_imp: "Added a typed event-driven contract evidence bus with declarative filters, stable provenance, duplicate suppression, sustained-state evidence, bounded diagnostics, and integrations for medical records, fax, freight, exports, sales, and account transfers."
