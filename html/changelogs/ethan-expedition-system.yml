author: "ethan"
delete-after: true
changes:
  - rscdel: "Removed the Deep Quarry depth/elevator system (SSquarry) and its map."
  - rscadd: "Added the expedition system: launch missions from the Expedition Control console to dynamically-generated planetary sites."
  - rscadd: "Added five expedition mission types — geological survey, hostile clearance, salvage recovery, artifact retrieval, and search & rescue — each with its own objective, content, and survey-point/Thaler rewards."
  - rscadd: "Added a dynamic point-of-interest system (vaults, fauna nests, survivor camps, salvage fields, supply caches, survey relays) that populates expedition sites."
  - rscadd: "Expedition sites recycle their z-levels once the crew leaves, so repeated launches don't leak."
  - rscadd: "Added a procedural building generator: expeditions can now contain derelict outposts with real rooms, corridors, and doors, plus a Derelict Sweep mission to clear them."
  - rscadd: "Expedition sites now vary by terrain biome — cavern, plains, asteroid, or low-orbit station deck — instead of always being caves."
  - rscadd: "Procedurally-generated building rooms are now furnished with themed contents (storage, quarters, work spaces) instead of being empty."
  - rscadd: "Added a five-tier expedition loot system (scrap to exotic): higher-difficulty, larger sites pull better rewards, with random spread and rare jackpots — including treasure safes, alien coins, and boss-grade gear."
  - rscadd: "Expedition sites now roll a size (small/medium/large) that scales how many points of interest, loot, and how large its derelict structures are."
  - rscadd: "Points of interest are now decorated with biome-appropriate set-dressing — remains, wreckage, flora, and grime — so each site feels distinct."
  - rscadd: "Reworked expeditions onto a composable objective system with eleven goal types (eliminate, slay elite, clear structure, retrieve, collect, rescue, survey, reach, restore terminal, demolish, hold the line) and five new mission types (Demolition Raid, Black Box Recovery, Hold the Line, Deep Recon, Systems Restoration)."
  - rscadd: "Missions can now combine required and bonus objectives, fail on a time limit or a total party wipe, and pay extra for completed bonus goals; the console shows live per-objective progress and pass/fail state."
  - rscadd: "Expedition objectives now use real game systems: demolition targets must be destroyed with actual weapons/explosives, survey markers must be logged with a scanner or analyzer, and the engineering objective stamps a real derelict thermoelectric engine bay (TEG, circulators, burn chamber, fuel) the crew must commission to actual power output."
  - rscadd: "Expedition contracts are now plotted from exploration craft controls and create physical short-jump destinations; crews fly to sites, land, recover objectives aboard, and fly home instead of teleporting."
  - rscdel: "Removed the standalone expedition console and bluespace extraction beacon."
  - rscadd: "Restored and ported the Southern Cross Exploration Carrier, its Dock 2 sling shuttle, and the carrier's short-jump craft."
  - rscadd: "Unified helm, navigation, docking, propulsion, sensor, and expedition planning into a vessel-aware Flight Operations console with orbital and planetary route views."
  - rscadd: "Expedition sites are now surveyed as lightweight destinations and generated during the outbound jump, with generation progress and safe destination leasing."
  - refactor: "Replaced tile-grid overmap navigation and collision movement with authoritative celestial orbit, docking, and planetary surface state."
  - qol: "Rebuilt Flight Operations as one navigable 3D celestial scene with synchronized orbits, distinct stars, planets, stations and vessels, and clickable latitude/longitude expedition sites."
  - rscadd: "Expeditions now generate complete hostile stations with Command, AI, Security, Medical, Engineering, Logistics, and Docking departments, functional furnishings, breathable air, a shared physical power grid, life support mains, EVA vestibules, and destructible service dependencies."
  - rscadd: "Added an event-driven station defense director with local and AI-coordinated knowledge, finite squads, sensor detection, patrols, tactical responses, medical retreat, Engineering repair, reinforcements, and strategic station-assault objectives."
  - admin: "Added a debug verb that generates a complete procedural station from a reproducible seed and moves the invoking admin or observer to its docking entry."
  - imageadd: "Generated stations now use Southern Cross-inspired finished flooring, department-color trim, room-specific floor treatments, denser functional decoration, and correctly aligned wall fixtures."
  - maptweak: "Expanded debug stations use four content-sized rooms per department and generate in clean surrounding space instead of asteroid rock."
  - refactor: "Replaced generated station spine-and-box layouts with semantic department clustering around a stepped public circulation loop, irregular room footprints, foyer thresholds, route alcoves, and chamfered hulls."
  - bugfix: "Generated station validation now rejects repetitive room grids, monolithic halls, disconnected circulation, excessive direct frontage, and repeated door rhythms, with multi-seed visual diagnostic galleries."
