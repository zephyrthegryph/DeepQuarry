author: "Codex"
delete-after: true
changes:
  - bugfix: "Space suit repairs clean up completed breaches and repair all breaches within the available budget."
  - bugfix: "pAI hardware repairs require successful consumption of their replacement part."
  - bugfix: "Empty macrobatteries dispose of unused projectiles."
  - bugfix: "Hardsuit modification kits provide only one refit of each component kind."
  - bugfix: "Mining drills require their power cell to deliver the full required charge."
  - bugfix: "Rig grenade launchers grant ammunition only after consuming the replacement grenade."
  - bugfix: "Rejected configured artifact effects are disposed of instead of leaking."
  - code_imp: "Modkits, permits, optical devices and mining scanners use native operations."
  - code_imp: "Resonators, shovels, translators and folding equipment use native operations."
  - bugfix: "Unsupported translator language choices leave its selected language unchanged."
  - bugfix: "Attaching an organ disposes of every incompatible carried affliction."
  - code_imp: "Camera circuit boards, handheld scanners, speech devices and printers use native controls."
  - code_imp: "Cosmetics and folding shields use native operations."
  - code_imp: "Patient monitors, fabricator controls, AI module configuration, decorative cards, supply boards, Geiger controls and folding blades use native operations."
  - bugfix: "Robot fabricators credit steel only after consuming it successfully, and cancel insertion when its source stack has been deleted."
  - code_imp: "Floor painter settings, transforming tools, hat controls, towels and security electronics use native operations."
