author: "ethan"
delete-after: true
changes:
  - rscadd: "Atmospherics now runs fully on the Rust auxmos arena — gas math, diffusion, pressure equalisation, multi-z sharing, planetary atmospheres, reactions, and gas overlays are all arena-backed."
  - bugfix: "Fixed the station booting in vacuum (gas roster was registered after mapload parsed turf air)."
  - bugfix: "Fixed gas not spreading, equalising, or rendering on tiles reached purely by diffusion (arena turf adjacency is now pushed bidirectionally and gas-recipient tiles are enabled for visual/reaction processing)."
  - bugfix: "Fixed gas thruster thrust, pipe-network reconcile_air mass balance, and planetary-atmosphere pollution draining."
  - code_imp: "Hardened the Rust atmospherics FFI: every bind is now panic-safe (a bad argument or internal error is logged and recovered instead of crashing the server)."
  - rscadd: "Superconductivity (heat conduction) is back online, ported to the Rust auxmos arena: turf-to-turf, turf-to-space radiation, and turf-to-gas heat sharing run on a detached worker thread as a new SSair step."
  - bugfix: "Fixed a server crash during expedition site generation (and other atmos teardown paths): the Rust atmos library was built against a mismatched (515-era) BYOND ABI. Upgraded it onto the modern byondapi (BYOND 516.1682), which resolves the crash properly instead of masking it."
  - server: "The server now requires BYOND 516.1682 or newer (up from 516.1681). This is the build that ships the modern byondapi ABI the Rust atmos library links against."
  - bugfix: "Fixed three duplicate-shuttle-registration runtimes at round start (Escape, Merchant, Skipjack): the superseded common-map shuttle datums are now deferred so only the Southern Cross versions register."
  - server: "Slimmed the Docker image (~5.1GB to ~3.5GB) by dropping build-only artifacts (Rust target dir, tgui node_modules, provenance git) that were being copied into the runtime image."
