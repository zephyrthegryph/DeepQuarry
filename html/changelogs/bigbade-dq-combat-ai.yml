author: "BigBadE"
delete-after: true
changes:
  - rscadd: "New modular combat AI framework under modular_dq/combat_ai/. /datum/ai_brain replaces the legacy /datum/ai_holder god-class for every simple_mob in the codebase. Behaviors, target selectors, factions, and the per-mob world model are all composable singletons."
  - rscadd: "Mobs declare combat behavior via a list of /datum/ai_behavior typepaths (or fall back to a stat-derived default set) instead of subtyping the AI holder. Held items and active modifiers can also grant behaviors, so equipment and statuses now shape moveset directly."
  - rscadd: "Faction relationships moved to /datum/faction_data — a per-faction static table that maps faction strings to dispositions (ALLY/FRIENDLY/NEUTRAL/WARY/HOSTILE/NEMESIS). Personal grudges are tracked per-brain via weakrefs and decay over time."
  - rscadd: "A* pathfinding integration on the brain — approach_threat, return_home, follow_leader use the same /datum/pathfinding/astar machinery the legacy holder did, including ID-card access for doors."
  - rscadd: "Telegraphed special moves: the new charge_slam behavior crouches, announces, then dashes for bonus damage — readable, dodgeable, and reusable across any mob that lists it."
  - rscadd: "Added quarry_stalker as a canary mob using the new framework end-to-end (threaten / approach / melee / charge_slam / flee / wander)."
  - rscadd: "Tactical parity behaviors: evasive_juke, kite_away, hit_and_run, pack_retreat, return_home, follow_leader, retaliate_to_attacker, maul_unconscious, idle_speak — collectively replacing the post_*_attack hooks of the legacy AI subtypes (ranged/kiting, melee/evasive, melee/pack_mob, hostile/humanoid)."
  - rscadd: "Glitch boss's seven special attacks (popup ads, calldown, bomb lines, bullet hell, illusions, confusion, speed-up) are now seven discrete /datum/ai_behavior subtypes, each with its own evaluate() gating and cooldown."
  - rscadd: "Slime discipline / voice-command / grudge state moved off /datum/ai_holder/simple_mob/xenobio_slime onto a new /datum/slime_state datum on the slime mob. The voice-command listener (on_hear_say) is rebound to the slime mob's hear_say re-open."
  - rscdel: "Deleted the entire code/modules/ai/ folder — ai_holder.dm, ai_holder_combat.dm, ai_holder_combat_unseen.dm, ai_holder_communication.dm, ai_holder_cooperation.dm, ai_holder_debug.dm, ai_holder_disabled.dm, ai_holder_fleeing.dm, ai_holder_follow.dm, ai_holder_movement.dm, ai_holder_pathfinding.dm, ai_holder_targeting.dm, ai_holder_targeting_vr.dm, plus the ai_holder_subtypes/ tree. The three carry-over files (_defines.dm, interfaces.dm, say_list.dm) moved into modular_dq/combat_ai/legacy_constants/."
  - rscdel: "Deleted the /datum/ai_holder type entirely. No stub remains. Every reference to mob.ai_holder.X across vore, capture crystal, gaia, telesci, admin verbs, technomancer spells, slime potions, slime scanner, and ~150 mob subtype files was rewritten to use mob.ai_brain.X or removed where there's no modern equivalent."
  - rscdel: "Stripped ai_holder_type = /datum/ai_holder/... assignments from all .dm and .dmm files (22 DMM map files, 200+ mob subtype files). Inline /datum/ai_holder/.../proc declarations in mob files all removed."
  - rscdel: "Deleted the has_AI / set_AI_busy / is_AI_busy / get_AI_stance shim procs on /mob/living. External callers (doors, vore, stairs, weapons, admin) inlined to use ai_brain directly."
  - balance: "Every simple_mob is now driven by the modern brain. Default behaviors are stat-derived; passive/inert/retaliate legacy subtypes are auto-detected so pets and wildlife don't aggress on sight."
  - rscadd: "Per-mob quirks ported as /datum/ai_behavior subtypes or selectors: bigdragon's three-special rotation (tail sweep / charge / fire breath) chooses by range and crowding; possum hiss-then-play-dead state machine; poppy alarm-word listener; swoopie pest/trash toggles; teppi affinity-gated follow/unfollow voice commands; parrot/cookiegirl/wolfgirl/leaper/armadillo torta/catslug voice replies."
  - rscadd: "Quarry noise system redirects idle mobs toward noise sources via /datum/ai_behavior/walk_to_destination; sleeping mobs wake on noise."
  - code_imp: "Item types may override get_dq_granted_behaviors() to expose AI behaviors while held. Grenades and guns are wired by default; mobs holding either gain throw-grenade / aimed-shot moves automatically."
  - code_imp: "Re-opens /mob/living/apply_damage and /mob/living/attack_generic to feed every incoming hit into the brain's notify pipeline. The brain promotes attackers to personal HOSTILE entries so retaliation, ally distress signals, and threat updates fire automatically."
  - bugfix: "Reactive stealth armor's illusion decoy actually walks to a random nearby turf again (cleanup script had stripped its destination assignment)."
  - bugfix: "Mob-spawning gamemaster event again walks newly-spawned simple_mobs toward the station edge."
  - bugfix: "Portal multi-z back-link wiring restored — /obj/structure/portal_event and /obj/structure/portal_target's target field is not AI-related and was wrongly stripped during cleanup."
  - code_imp: "Player-castable AI behaviors. Behaviors override /datum/ai_behavior/get_player_verb_info() to expose themselves as moves a player-controlled mob can trigger via the 'Use Combat Move' verb. Charge-slam, throw-grenade, and the bigdragon's tail-sweep / charge / fire-breath rotation are exposed by default."
  - rscadd: "Unit test suite for the combat AI framework (modular_dq/code/unit_tests/dq_combat_ai_tests.dm). 15 tests covering behavior flyweight contract, well-formedness, faction registry, brain init, give_target/notify_damage threat promotion, personal-disposition override, item-granted behaviors, rebuild_behaviors merging held grants, give_destination, set_hostile, item-granted-no-brain-cooldown audit."
  - bugfix: "Audit pass found and fixed: duplicate /mob/living/Initialize overrides (DM resolves to last-included, silently dropping say_list creation); colon-access syntax (threat:health) in pack_retreat; solargrub.Life() reading the dead legacy-mirror .target field instead of .primary_threat; busy flag could stick TRUE if a behavior's start() runtimed before clearing it; charge_slam's windup timer could fire after brain qdel; bigdragon's specialtoggle/nospecial/flametoggle preconditions were only in evaluate(), bypassed by player-manual-target invocation."
  - bugfix: "Player verb hardening: re-verify held source after tgui prompt (player may have dropped item), QDELETED check on target before commit, cap view scan at 14 tiles for behaviors with INFINITY max_range."
  - bugfix: "Pruned dead legacy-mirror fields (target, retaliate, pointblank, stance, faction_friends) from /datum/ai_brain — they were never written by the modern brain. Affected upstream readers (denecrotizer revive gate, vore newspaper-tease, /mob/living/Destroy faction_friends cleanup, tension threat estimator) updated to use brain primitives or modern equivalents."
  - bugfix: "Brain retarget reorients the mob's sprite immediately when same-type behavior switches to a new target, instead of waiting for the next tick step."
  - bugfix: "Final pre-PR audit: null-safe deref on denecrotizer's ai_brain check (mobs without a brain no longer runtime); bigdragon charge now passes default check_trajectory flags (can charge through windows/grilles like legacy); removed duplicate /datum/say_list/pirate and /datum/say_list/cyber_horror definitions left over from upstream merges; charge_slam no-op stop() override deleted."
  - code_imp: "Player verb improvements: dispatcher verb is added lazily on COMSIG_MOB_LOGIN instead of every brain init (avoids verb-list bloat on thousands of wild mobs); auto_target behaviors fall back to manual target prompt when evaluate() returns null (so player can pick a target even without an AI-set threat); target prompt filters out FRIENDLY/ALLY mobs (anti-grief on possessed-mob abuse); player invocation routes through brain.run_behavior() for proper lifecycle (no more race between verb-set busy and brain tick)."
  - rscadd: "2 more tests: dq_combat_ai_stop_active_clears_busy (regression guard on the defensive busy-clear in stop_active), dq_combat_ai_login_adds_player_verb (lazy verb registration). 17 tests total, all pass."
