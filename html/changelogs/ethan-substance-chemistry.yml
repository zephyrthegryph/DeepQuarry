author: "ethan"
delete-after: true
changes:
  - rscadd: "Added the substance & chemistry system — the science core. A substance is always a real material: field expeditions return stacks of raw substance alloy. Each has a visible surface behavior (an effect family and a trigger) and a hidden five-axis profile (energy, volatility, affinity, resonance, purity) that rerolls every round."
  - rscadd: "Added the substance combiner (alloying station): load two substance material stacks and combine them. Matching resonance reinforces, adjacent resonance transforms into a new effect, opposing resonance conflicts — producing byproduct stacks and, when pushed hard, a hazard that erupts on the machine. Results are reason-about-it-but-get-surprised, never a fixed recipe."
  - rscadd: "Substance properties are learned, never scanned: the combiner keeps shared Field Notes that fill in as you experiment — combine a source with itself to probe its axes, combine two sources to map their resonance relationship."
  - rscadd: "Substances are ordinary materials: forge a substance alloy stack into weapons, plating, and gear through the normal in-hand material crafting menu (the same way exotic materials are worked). The alloy's structural stats are derived from the substance, and anything made from it carries the substance's effect — it discharges wherever its trigger condition is met in that form (a strike, a thrown impact, a projectile or EMP hit, fire, or a bare-handed touch), downsides and all, for a limited number of charges."
  - rscadd: "Added the substance refiner: push one property of a substance higher at the cost of the others (purify for power and lose stability; tune the resonance to aim a counter and muddy the rest), so a refined counter is genuinely situational, never a flat upgrade."
  - rscadd: "Added the substance extractor: render xenobiology slime extracts into high-affinity bio substance and bred xenobotany produce into clean bulk substance — complementary to volatile field finds, so a powerful, stable, clean product wants all three sources."
  - rscadd: "Combinations are now shaped by where they happen: the combiner's ambient temperature and pressure raise or lower the reaction's volatility (run it cold to tame a mix, hot to weaponise it), and exceeding the rig's containment ceiling fails containment regardless of the substances involved."
  - rscadd: "Substance gear now behaves like a real exotic material: radiant and discharge alloys glow, hot radiant/void alloys give off radiation, and corrosive/spore alloys are mildly toxic to carry — and a substance structure, wall, or piece of armour discharges its effect when it is destroyed or its wearer is struck. Potent substances also sell for more."
  - rscadd: "The substance extractor now also renders a harvested xenoarchaeology artifact essence (an anomaly battery) into a field substance keyed to the captured anomalous effect."
  - bugfix: "Reworked the material behaviour system so a material's luminescence, radioactivity, and toxicity actually take effect on items made from it (previously the magnitudes were carried but never applied)."
  - balance: "Removed the material-synergy system (machine bonuses from stock-part material properties)."
  - rscadd: "Lathe designs can now be material-selectable: instead of a separate techweb entry per material, a single design (e.g. Material Knife, Material Sword) shows a material picker in the fabricator UI, and the chosen loaded material — steel, an exotic alloy, or a substance alloy — is consumed and made into the item, carrying that material's properties and effects. Works on both the protolathe and the autolathe, with the usual x1/x5/x10/max print quantities. Load a substance alloy stack into either lathe and forge a discharge knife from it."
  - rscadd: "Added Material Rounds (9mm): a material-selectable lathe design that forges a 9mm magazine from a chosen loaded alloy. The rounds fit any 9mm sidearm, and a magazine forged from a substance alloy makes each round discharge the substance's effect where it strikes — the ranged counterpart to a substance blade. Only impact/pressure substances erupt from a bullet (the same form-trigger rule a blade obeys); other substances still fire as ordinary rounds."
  - rscadd: "Substance refining is now done with the particle accelerator: load a substance sheet into a particle smasher, pick the refinement, and bombard it with the accelerator beam — once it charges up, the sheet recasts as the refined alloy (pushing one property at the cost of the others, as before)."
  - rscadd: "Substance combining is now done in the R-UST fusion reactor: feed two substance stacks into the core's reactant slots and the running field fuses them, casting the combined alloy and feeding the reaction's energy back into the reactor as power. A clean, high-yield fuse steadies the field; a volatile or opposing mix destabilises it toward a breach — so a dangerous combination is a real reactor hazard, not a free lab accident."
