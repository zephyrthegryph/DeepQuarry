author: "BigBadE"
delete-after: true
changes:
  - rscadd: "Crew can fund Cargo orders from their personal accounts, with immediate payment and automatic refunds for denied orders."
  - rscadd: "Service checkout scanners and registers now support subsidized food and drink charges through the station service economy."
  - balance: "Payroll is now the first monthly department expense, uses equal automatic allocations by default, and distributes partial payroll fairly when funds run short."
  - rscadd: "Added Equal, Staffing, Payroll, and Manual station allocation policies plus payroll coverage and shortfall reporting to Department Management."
  - rscadd: "Added a personal Cargo PDA app with order tracking, owner-authorized cancellation, refunds, and status notifications."
  - admin: "Added an Economy Observatory covering monetary flow, sources and sinks, department solvency, payroll, Service subsidies, and personal Cargo activity."
  - rscadd: "Reworked Service scanners and registers into consent-based itemized checkout: customers see personal and subsidy amounts before confirming, while staff receive immutable receipts and audited refunds."
  - balance: "Service heads can set the standard checkout subsidy rate from Department Management; all food and drink now use the same paid checkout policy."
  - rscadd: "Added a shift-wide Service invoice ledger, customer PDA receipts, full refunds, and optional gratuities split between Service staff and their department."
  - bugfix: "Made Service refunds reverse subsidies and both gratuity shares without a separate dispute or debt state."
  - qol: "Added Service invoice channels, tips, refunds, and net sales to department finances, plus liquidity, payroll, sales, and refund telemetry to the Economy Observatory."
  - code_imp: "Audited player purchase paths and made vending and arcade ID payments conservative account transfers."
  - rscadd: "Unified Cargo, mining, exploration, and survey purchases and rewards around Thaler accounts."
  - rscadd: "Added 15-minute departmental budget cycles with monthly allocations, payroll projections, savings rollover, and period reporting."
  - balance: "NanoTrasen now contributes 75% of projected station payroll as monthly station income, with income sources visible to Command."
  - bugfix: "Stopped unwatched atmosphere mixtures and station-wide air-alarm radio fanout from overrunning Machines processing."
  - balance: "Supply orders now charge the requesting department when approved and refund cancelled unshipped orders."
  - bugfix: "Enforced accounts-terminal financial permissions on the server and repaired the Research retail account link."
  - qol: "Reworked employee records computers into Department Management Consoles with head-scoped finance dashboards and Command budget allocation."
  - bugfix: "Service checkout totals and descriptions are now derived from the same canonical item rows, and payment confirmation detects staff-attribution changes."
  - bugfix: "Obstructed mech-fabricator outputs retain producer provenance, and internal contract escrow no longer distorts currency creation or destruction telemetry."
  - bugfix: "Contract escrow, payouts, refunds, and manual account activation now preserve funds transactionally when an account is unavailable."
  - bugfix: "Service refunds now require provider-department or Command authorization, and changing a checkout provider clears the old ticket and staff attribution."
  - balance: "Insufficient station allocation funds are now divided proportionally between departments instead of favoring department list order."
  - bugfix: "Security custody evidence now rejects dead subjects and credentials hidden inside carried containers."
  - qol: "Cargo ordering now displays spendable department savings, while economy diagnostics distinguish external-sink refunds from internal reversals."
