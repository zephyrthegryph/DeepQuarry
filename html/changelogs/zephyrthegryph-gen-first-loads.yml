author: "zephyrthegryph"
delete-after: true
changes:
  - code_imp: "Post-boot construction places final turfs as one load (place_turfs), and a new z-level's turfs initialize in the chunked load instead of inside the allocation call"
  - bugfix: "A generated station's tile plan is handed to its result without an ownership error, so its tiles are applied"
  - code_imp: "Expedition buildings are planned as data and placed once as final turfs (one ChangeTurf per footprint tile instead of fill-then-carve)"
  - code_imp: "The world x/y size is fixed once Rust is configured; a map template that does not fit is refused with a warning"
